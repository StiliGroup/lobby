# Stili Soft · pruebas automáticas: corren en cada cambio y antes de publicar en main.
name: Pruebas
on:
  push:
  pull_request:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sintaxis de los scripts compartidos
        run: for f in stili-*.js config.js sw.js; do node --check "$f"; done
      - name: Contabilidad (librería de cálculos)
        run: node test_contabilidad.js
      - name: Una sola versión de la barra en todas las páginas
        run: |
          v=$(grep -oP "VERSION_BARRA = '\K[0-9.]+" stili-modulos.js)
          malas=$(grep -rLE "stili-modulos\.js\?v=$v" $(grep -rl "stili-modulos.js" --include=*.html .) || true)
          if [ -n "$malas" ]; then echo "Páginas con otra versión de la barra (debe ser $v):"; echo "$malas"; exit 1; fi
