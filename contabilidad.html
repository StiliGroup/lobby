<!doctype html>
<html lang="es-DO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contabilidad · Stili Soft</title>
<meta name="description" content="Contabilidad de cada torre: cuotas y recibos, cobros, cobranza, bancos, conciliación y cierre, reportes y contabilidad formal.">
<meta name="theme-color" content="#003A75">
<link rel="icon" href="portal/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="stili-estilo.css?v=3.0">
<script src="config.js"></script>
<script src="stili-modulos.js?v=3.4"></script>
<script src="stili-contabilidad.js?v=3.2"></script>
<style>
.ctb-cab { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.ctb-cab select, .ctb-cab input { font: inherit; padding: 8px 10px; border-radius: 9px; border: 0; background: #fff; color: #13293D; max-width: 100%; }
.ctb-cab label { display: flex; flex-direction: column; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #DCE6F2; gap: 3px; }
.secciones nav { overflow-x: auto; scrollbar-width: thin; }
.sub { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
.sub button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 12px; font-weight: 600; cursor: pointer; font-size: 13px; }
.sub button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
.sub .n { background: var(--crit); color: #fff; border-radius: 999px; padding: 0 6px; font-size: 11px; margin-left: 4px; }
td.num, th.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.rojo-t { color: var(--crit); } .verde-t { color: var(--ok); } .ambar-t { color: var(--warn); }
.dos { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 900px) { .dos { grid-template-columns: 1fr; } }
.alertas { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.alertas li { padding: 8px 12px; border-radius: 9px; background: var(--panel-2); font-size: 14px; border-left: 4px solid var(--line); }
.alertas li.rojo { border-left-color: var(--crit); background: var(--crit-suave); } .alertas li.ambar { border-left-color: var(--warn); background: var(--warn-suave); }
.formula { background: var(--panel-2); border-radius: 10px; padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; font-size: 14px; }
.formula b.tot { border-top: 2px solid var(--line); padding-top: 4px; }
.formula .tot { border-top: 2px solid var(--line); padding-top: 4px; font-weight: 700; }
.mini { font-size: 12px; color: var(--muted); }
.grid-aptos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.grid-aptos label { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; }
.grid-aptos input { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); font: inherit; }
.chk { display: flex; gap: 6px; align-items: center; font-weight: 600; }
.clases-sel { display: flex; flex-wrap: wrap; gap: 8px 16px; } .clases-sel label { display: flex; gap: 6px; align-items: center; font-weight: 600; font-size: 13px; } .clases-sel input { width: auto; }
tr.sel td { background: var(--azul-suave); }
.pegar { cursor: pointer; } .pegar:hover td { background: var(--panel-2); }
.kpi small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.kpi.rojo b { color: var(--crit); } .kpi.ambar b { color: var(--warn); }
.cerrado { background: var(--ok-suave); color: var(--ok); }
.tabla table td .btn { padding: 5px 9px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
#progreso { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 95; pointer-events: none; }
#progreso i { display: block; height: 100%; width: 0; background: #DCB40C; transition: width .3s; }
#progreso.indet i { width: 40%; animation: ctbbar 1.1s infinite linear; }
@keyframes ctbbar { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
@media (max-width: 640px) { .formula { font-size: 13px; } .ctb-cab { width: 100%; } .ctb-cab label { flex: 1 1 140px; } }
</style>
</head>
<body>
<header class="cabecera"><div class="fila gutter">
  <div class="titulo"><small>Stili Group · Finanzas</small><b>Contabilidad</b></div>
  <div class="ctb-cab" id="cab"></div>
</div></header>
<div class="secciones"><nav class="gutter" id="nav" role="tablist" aria-label="Contabilidad"></nav></div>
<main class="gutter" id="contenido"><p class="nota">Cargando…</p></main>
<dialog id="dlg"><div class="cuerpo" id="dlg-cuerpo"></div></dialog>
<script>
'use strict';
const K = StiliContab;
const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DEMO = new URLSearchParams(location.search).has('demo');
const dinero = v => v === null || v === undefined || v === '' || isNaN(v) ? '—' : (Number(v) < 0 ? '−' : '') + 'RD$ ' + Math.abs(Number(v)).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const din0 = v => v === null || v === undefined || isNaN(v) ? '—' : (Number(v) < 0 ? '−' : '') + 'RD$ ' + Math.abs(Math.round(Number(v))).toLocaleString('en-US');
const fecha = f => { const s = String(f || ''); const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3] + '/' + m[2] + '/' + m[1] : esc(s); };
const mesTxt = per => per ? K.nombreMes(per) : '';
const plural = (n, uno, varios) => n + ' ' + (n === 1 ? uno : varios);
const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
const libreria = (url, global) => window[global] ? Promise.resolve() : new Promise((ok, mal) => { const s = document.createElement('script'); s.src = url; s.onload = ok; s.onerror = () => mal(new Error('No se pudo cargar el lector de Excel. Revise la conexión.')); document.head.appendChild(s); });
const toast = (msg, error) => { let el = $('#aviso'); if (!el) { el = document.createElement('div'); el.id = 'aviso'; el.setAttribute('role', 'status');
  el.style.cssText = 'position:fixed;left:50%;bottom:22px;transform:translateX(-50%);color:#fff;padding:10px 16px;border-radius:10px;z-index:90;max-width:calc(100% - 32px);font-weight:600'; document.body.appendChild(el); }
  el.style.background = error ? '#B3261E' : '#13293D'; el.textContent = msg; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, error ? 7000 : 3500); };
const Progreso = { indet(si) { let b = $('#progreso'); if (!b) { b = document.createElement('div'); b.id = 'progreso'; b.innerHTML = '<i></i>'; document.body.appendChild(b); } b.className = si ? 'indet' : ''; } };
async function api(accion, datos) {
  Progreso.indet(true);
  try { return DEMO ? await Demo.llamar(accion, JSON.parse(JSON.stringify(datos || {}))) : await StiliModulos.api(accion, datos); }
  finally { Progreso.indet(false); }
}
const hoy = () => K.hoyISO();

// ------------------------------------------------------------------ estado
const SECCIONES = [['inicio', 'Inicio'], ['cuotas', 'Cuotas y recibos'], ['cobros', 'Cobros'], ['cobranza', 'Cobranza'], ['bancos', 'Pagos y bancos'], ['conciliacion', 'Conciliación y cierre'],
  ['reportes', 'Reportes'], ['formal', 'Contabilidad formal'], ['config', 'Configuración'], ['control', 'Control'], ['global', 'Todas las torres']];
const S = { torres: [], torre: '', D: null, sec: 'inicio', sub: {}, periodo: hoy().slice(0, 7), apto: '', cobro: null, conc: { cuenta: '', periodo: '', parejas: [], saldo: '', marcaB: '', marcaL: '' } };
// v3.1 · la torre es la misma de la barra (StiliModulos.torre) en todas las páginas; 'ctb_torre' queda de respaldo
const normT = t => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
const deLista = n => S.torres.find(t => normT(t) === normT(n)) || '';
const guardarPref = () => { try { localStorage.setItem('ctb_torre', S.torre); } catch (e) { /* sin almacenamiento */ } if (window.StiliModulos && StiliModulos.fijarTorre) StiliModulos.fijarTorre({ torre: S.torre }, true); };
const leerPref = () => { const g = window.StiliModulos && StiliModulos.torre ? StiliModulos.torre().torre : ''; if (deLista(g)) return deLista(g); try { return localStorage.getItem('ctb_torre') || ''; } catch (e) { return ''; } };
function cambiarTorre(t) { S.torre = t; guardarPref(); S.apto = ''; S.cobro = null; S.conc = { cuenta: '', periodo: '', parejas: [], saldo: '' }; pintarCab(); cargarTorre(); }
window.addEventListener('stili:torre', e => { const t = deLista(e.detail && e.detail.torre); if (t && t !== S.torre) cambiarTorre(t); });
const puede = () => S.D && S.D.puede_editar;
const cfg = () => K.reglas(S.D ? S.D.config : {});
const rubros = () => (S.D && S.D.rubros && S.D.rubros.length ? S.D.rubros : K.rubrosBase());
const datos = () => Object.assign({}, S.D, { rubros: rubros() });
const cuentasAct = () => (S.D.cuentas || []).filter(c => c.activa !== 'no');
const nomCuenta = id => { const c = (S.D.cuentas || []).find(x => x.id === id); return c ? c.nombre : '—'; };
const nomRubro = cod => K.nombreRubro(rubros(), cod);

function opcRubros(tipo, sel) {
  const rs = rubros().filter(r => r.tipo === tipo && r.activo !== 'no');
  return '<option value="">Elegir rubro…</option>' + rs.filter(r => !r.padre).map(g => '<optgroup label="' + esc(g.codigo + ' · ' + g.nombre) + '">' +
    rs.filter(r => r.padre === g.codigo).map(r => '<option value="' + esc(r.codigo) + '"' + (r.codigo === sel ? ' selected' : '') + '>' + esc(r.codigo + ' · ' + r.nombre) + '</option>').join('') + '</optgroup>').join('');
}
const opcCuentas = (sel, tipo) => '<option value="">Elegir cuenta…</option>' + cuentasAct().filter(c => !tipo || c.tipo === tipo).map(c => '<option value="' + esc(c.id) + '"' + (c.id === sel ? ' selected' : '') + '>' + esc(c.nombre) + '</option>').join('');
const opcAptos = sel => '<option value="">Elegir apartamento…</option>' + (S.D.aptos || []).map(a => '<option' + (a === sel ? ' selected' : '') + '>' + esc(a) + '</option>').join('');
const tabla = (cab, filas, vacio, pie) => filas.length ? '<div class="tabla"><table><thead><tr>' + cab.map(c => '<th' + (/^\$/.test(c) ? ' class="num"' : '') + '>' + esc(c.replace(/^\$/, '')) + '</th>').join('') + '</tr></thead><tbody>' + filas.join('') + '</tbody>' + (pie || '') + '</table></div>' : '<div class="vacio">' + esc(vacio) + '</div>';
const subtabs = (sec, lista) => { const act = S.sub[sec] || lista[0][0]; return '<div class="sub" role="tablist">' + lista.map(([k, t, n]) => '<button type="button" data-sub="' + sec + ':' + k + '" aria-pressed="' + (act === k) + '">' + esc(t) + (n ? '<span class="n">' + n + '</span>' : '') + '</button>').join('') + '</div>'; };
const subAct = (sec, def) => S.sub[sec] || def;

// ------------------------------------------------------------------ carga
async function iniciar() {
  try {
    const g = await api('ctb_global');
    S.torres = g.torres.map(t => t.torre); S.global = g;
    if (window.StiliModulos && StiliModulos.ponerTorres && (DEMO || !document.querySelector('.sm-torre:not([hidden])'))) StiliModulos.ponerTorres(S.torres.map(t => ({ torre: t })));
    if (!S.torres.length) { $('#contenido').innerHTML = '<div class="vacio">Su usuario no tiene torres asignadas.</div>'; return; }
    const pref = leerPref();
    S.torre = S.torres.indexOf(pref) >= 0 ? pref : S.torres[0]; guardarPref();
    leerHash(); pintarCab();
    await cargarTorre();
  } catch (err) { $('#contenido').innerHTML = '<div class="card"><p>' + esc(err.message) + '</p>' + (/sesi/i.test(err.message) ? '<a class="btn primario" href="portal/">Entrar en el Portal</a>' : '') + '</div>'; }
}
async function cargarTorre() {
  try { S.D = await api('ctb_datos', { torre: S.torre }); pintar(); }
  catch (err) { toast(err.message, true); $('#contenido').innerHTML = '<div class="card"><p>' + esc(err.message) + '</p></div>'; }
}
async function enviar(accion, datosEnvio, aviso) {
  try { const r = await api(accion, Object.assign({ torre: S.torre }, datosEnvio)); if (r && r.torre !== undefined && r.recibos) S.D = r; pintar(); if (aviso || (r && r.aviso)) toast((r && r.aviso) || aviso); return r; }
  catch (err) { toast(err.message, true); return null; }
}
// v3.1 · «#seccion/pestaña» (p. ej. #reportes/liquidacion): los temas del menú abren la pestaña exacta
function leerHash() { const [h, sub] = decodeURIComponent(location.hash.replace('#', '')).split('/'); if (SECCIONES.some(([k]) => k === h)) { S.sec = h; if (sub) S.sub[h] = sub; } }
function ponerHash() { const sub = S.sub[S.sec]; history.replaceState(null, '', '#' + S.sec + (sub ? '/' + sub : '')); if (window.StiliModulos && StiliModulos.marcar) StiliModulos.marcar(); }
window.addEventListener('hashchange', () => { leerHash(); pintar(); window.scrollTo(0, 0); });
function pintarCab() {
  const enBarra = !!document.querySelector('.sm-torre:not([hidden])');   // v3.1 · si la barra ya tiene el selector de torre, aquí no se repite
  $('#cab').innerHTML = (enBarra ? '' : '<label>Torre<select id="sel-torre" aria-label="Torre">' + S.torres.map(t => '<option' + (t === S.torre ? ' selected' : '') + '>' + esc(t) + '</option>').join('') + '</select></label>') +
    '<label>Mes<input type="month" id="sel-mes" value="' + esc(S.periodo) + '" aria-label="Mes"></label>';
}
function pintar() {
  $('#nav').innerHTML = SECCIONES.map(([k, t]) => {
    const n = k === 'cobros' && S.D ? (S.D.notificados || []).filter(x => x.estado === 'pendiente').length : 0;
    return '<button type="button" role="tab" data-sec="' + k + '" aria-selected="' + (S.sec === k) + '">' + esc(t) + (n ? '<span class="n">' + n + '</span>' : '') + '</button>';
  }).join('');
  if (!S.D && S.sec !== 'global') return;
  if (!S.D) { $('#contenido').innerHTML = vGlobal(); return; }
  const f = { inicio: vInicio, cuotas: vCuotas, cobros: vCobros, cobranza: vCobranza, bancos: vBancos, conciliacion: vConciliacion, reportes: vReportes, formal: vFormal, config: vConfig, control: vControl, global: vGlobal }[S.sec];
  const cerrado = K.mesCerrado(S.periodo + '-01', S.D.cierres);
  $('#contenido').innerHTML = (DEMO ? '<div class="aviso-edicion">Demostración con datos de ejemplo. Nada de lo que haga aquí se guarda.</div>' : '') +
    (cerrado && ['cuotas', 'cobros', 'bancos'].indexOf(S.sec) >= 0 ? '<div class="aviso-edicion">El mes de ' + esc(mesTxt(S.periodo)) + ' está cerrado: se puede consultar, pero no registrar movimientos con fecha de ese mes.</div>' : '') +
    (!puede() && S.sec !== 'global' ? '<div class="aviso-edicion">Su usuario puede consultar. Para registrar, pida el nivel «Editar» de «Finanzas · Contabilidad» al Gerente General.</div>' : '') + f();
}
document.addEventListener('change', e => {
  if (e.target.id === 'sel-torre') cambiarTorre(e.target.value);
  if (e.target.id === 'sel-mes') { S.periodo = e.target.value || hoy().slice(0, 7); pintar(); }
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-sec]'); if (b) { S.sec = b.dataset.sec; ponerHash(); pintar(); window.scrollTo(0, 0); return; }
  const s = e.target.closest('[data-sub]'); if (s) { const [sec, k] = s.dataset.sub.split(':'); S.sub[sec] = k; ponerHash(); pintar(); return; }
});

// ------------------------------------------------------------------ diálogos
function dialogo(html) { $('#dlg-cuerpo').innerHTML = html + '<div class="acciones-fila"><button type="button" class="btn" data-cerrar>Cerrar</button></div>'; $('#dlg').showModal(); }
document.addEventListener('click', e => { if (e.target.closest('[data-cerrar]')) $('#dlg').close(); });
function pedirMotivo(titulo) {
  return new Promise(ok => {
    $('#dlg-cuerpo').innerHTML = '<h2>' + esc(titulo) + '</h2><form id="f-motivo" class="form"><label class="ancho">Motivo (queda en el control de anulaciones)<textarea name="m" required minlength="4"></textarea></label></form>' +
      '<div class="acciones-fila"><button class="btn primario" type="submit" form="f-motivo">Confirmar</button><button type="button" class="btn" data-cerrar>Cancelar</button></div>';
    const d = $('#dlg'); d.showModal();
    const f = $('#f-motivo');
    f.onsubmit = ev => { ev.preventDefault(); const m = new FormData(f).get('m').trim(); d.close(); ok(m); };
    d.onclose = () => ok(null);
  });
}
async function anular(tabla, id, titulo) {
  const m = await pedirMotivo(titulo || 'Anular');
  if (!m) return;
  await enviar('ctb_guardar', { tabla, operacion: 'anular', id, motivo: m }, 'Anulado. Quedó en el control de anulaciones.');
}
document.addEventListener('click', e => { const b = e.target.closest('[data-anular]'); if (b) { const [t, id] = b.dataset.anular.split('|'); anular(t, id, b.dataset.titulo); } });

// ------------------------------------------------------------------ impresión (recibos, constancias, informes)
function imprimir(titulo, cuerpo) {
  const w = window.open('', '_blank');
  if (!w) return toast('Permita las ventanas emergentes para imprimir.', true);
  w.document.write('<!doctype html><html lang="es-DO"><head><meta charset="utf-8"><title>' + esc(titulo) + '</title><style>' + CSS_IMPRESION + '</style></head><body>' + cuerpo +
    '<p class="pie">Generado por Stili Soft · ' + esc(fecha(hoy())) + '</p><script>window.onload=()=>setTimeout(()=>window.print(),300)<\/script></body></html>');
  w.document.close();
}
const CSS_IMPRESION = 'body{font-family:Montserrat,Segoe UI,Arial,sans-serif;color:#13293D;margin:28px;font-size:13px}h1{font-size:20px;margin:0 0 4px;color:#003A75}h2{font-size:14px;margin:18px 0 6px;color:#003A75;text-transform:uppercase;letter-spacing:.06em}' +
  'table{width:100%;border-collapse:collapse;margin:6px 0}th,td{padding:6px 8px;border-bottom:1px solid #d6dde4;text-align:left}th{font-size:11px;text-transform:uppercase;color:#5A6B78}.num{text-align:right;white-space:nowrap}' +
  '.cab{display:flex;justify-content:space-between;border-bottom:3px solid #DCB40C;padding-bottom:10px;margin-bottom:14px}.tot td{font-weight:700;border-top:2px solid #13293D}.pie{color:#5A6B78;font-size:11px;margin-top:24px}.salto{page-break-after:always}.caja{border:1px solid #d6dde4;border-radius:8px;padding:10px 12px;margin-top:10px}';
function htmlRecibo(r) {
  const c = cfg(), ec = edoCuenta(r.apartamento);
  const otros = ec.pendientes.filter(x => x.id !== r.id), deudaPrev = otros.reduce((s, x) => s + K.c(x.saldo), 0);
  const prevClase = {}; ec.partidas.filter(p => p.recibo_id !== r.id).forEach(p => { prevClase[p.clase] = (prevClase[p.clase] || 0) + K.c(p.saldo); });
  const link = K.enlacePago(c, Object.assign({}, r, { saldo: (ec.pendientes.find(x => x.id === r.id) || r).saldo }), S.torre);
  return '<div class="cab"><div><h1>' + esc(S.torre) + '</h1><div>Recibo de mantenimiento · ' + esc(mesTxt(r.periodo)) + '</div></div><div style="text-align:right"><b>' + esc(r.numero) + '</b><br>Apartamento <b>' + esc(r.apartamento) + '</b>' + (r.ncf ? '<br>NCF ' + esc(r.ncf) : '') + '</div></div>' +
    '<table><tr><td>Emisión</td><td>' + fecha(r.emision) + '</td><td>Vence</td><td><b>' + fecha(r.vence) + '</b></td></tr></table>' +
    '<table><thead><tr><th>Concepto</th><th>Clase</th><th class="num">Monto</th></tr></thead><tbody>' + K.lineasDe(r).map(l => '<tr><td>' + esc(l.concepto) + '</td><td>' + esc(K.nombreClase(K.claseDe(l))) + '</td><td class="num">' + dinero(l.monto) + '</td></tr>').join('') +
    '<tr class="tot"><td colspan="2">Total del recibo</td><td class="num">' + dinero(r.total) + '</td></tr>' + (deudaPrev ? Object.keys(prevClase).map(k => '<tr><td colspan="2">Pendiente de meses anteriores · ' + esc(K.nombreClase(k).toLowerCase()) + '</td><td class="num">' + dinero(K.p(prevClase[k])) + '</td></tr>').join('') : '') +
    (ec.a_favor ? '<tr><td colspan="2">Saldo a favor</td><td class="num">−' + dinero(ec.a_favor) + '</td></tr>' : '') + '</tbody></table>' +
    (Number(c.pp_porcentaje) > 0 && K.descuentoProntoPago(Object.assign({}, r, { pagado: 0, pagado_cobros: 0 }), r.emision, c) > 0 ? '<div class="caja">Pagando el total a más tardar el ' + fecha(K.conDia(r.periodo, c.pp_dia)) + ' recibe ' + esc(c.pp_porcentaje) + ' % de descuento sobre la cuota ordinaria: paga ' + dinero(K.montoProntoPago(r, c)) + '.</div>' : '') +
    (link ? '<div class="caja">Pague en línea: ' + esc(link) + '</div>' : '') +
    (S.D.codigo_qr ? '<div class="caja">¿Ya pagó por transferencia? Avise y suba el comprobante en ' + esc(location.origin + location.pathname.replace(/[^/]*$/, '') + 'pago.html?c=' + S.D.codigo_qr) + '</div>' : '');
}
function htmlConstancia(k) {
  return '<div class="cab"><div><h1>' + esc(S.torre) + '</h1><div>Constancia de pago</div></div><div style="text-align:right">Apartamento <b>' + esc(k.apartamento) + '</b><br>' + fecha(k.fecha) + '</div></div>' +

  const porPagar = d.pagos.filter(p => p.estado !== 'pagada' && K.activo(p)).reduce((s, p) => s + K.c(p.monto), 0);

  const incumplidos = d.acuerdos.filter(a => a.estado === 'vigente' && K.estadoAcuerdo(a, d.cobros, h).estado === 'incumplido').length;
  const junta = d.pagos.filter(p => p.estado !== 'pagada' && K.requiereJunta(p.monto, d.config) && p.junta !== 'aprobada').length;

  pend.push('<li>' + (ult ? 'Último mes cerrado: <b>' + esc(mesTxt(ult)) + '</b>' : 'Todavía no se ha cerrado ningún mes.') + ' <a href="#conciliacion" data-sec="conciliacion">Conciliación y cierre</a></li>');

function vistaPrevia() {

  const prev = K.armarRecibos({ periodo: per, conceptos: S.D.conceptos, aptos: S.D.aptos.filter(a => !yaOrd.has(a)), valores: valoresParam(), config: c, emision: hoy() <= K.finDe(per) && hoy() >= K.inicioDe(per) ? hoy() : K.inicioDe(per) });
  const favor = K.aFavor(S.D.cobros), sald = K.conSaldo(S.D.recibos, S.D.cobros);
  return prev.map(r => Object.assign(r, { deuda: K.p(sald.filter(x => x.apartamento === r.apartamento).reduce((s, x) => s + K.c(x.saldo), 0)), favor: favor[r.apartamento] || 0 }));
}

function cuotasRecibos() {

function estadoConc() {
  const C = S.conc; C.cuenta = C.cuenta || (cuentasAct().find(c => c.tipo === 'banco') || cuentasAct()[0] || {}).id || ''; C.periodo = S.periodo;
  if (!C.cuenta) return null;
  const hechos = S.D.conciliaciones.filter(k => K.activo(k) && k.cuenta_id === C.cuenta).reduce((a, k) => a.concat(k.claves || []), []);
  const ext = S.D.extracto.filter(x => x.cuenta_id === C.cuenta && x.estado !== 'conciliado');
  return K.conciliar({ cuentaId: C.cuenta, d: datos(), periodo: C.periodo, extracto: ext, saldoBanco: C.saldo === '' ? null : Number(String(C.saldo).replace(/,/g, '')), parejas: C.parejas, yaConciliados: hechos });
}

function concCierre() {
  const anio = S.periodo.slice(0, 4), meses = Array.from({ length: 12 }, (_, i) => anio + '-' + String(i + 1).padStart(2, '0')).filter(m => m <= hoy().slice(0, 7));
  const cts = cuentasAct();
  return '<div class="card"><h2>Cierre de mes · ' + anio + '</h2><p class="nota">Un mes se cierra cuando todas sus cuentas están conciliadas. Al cerrar se guardan en PDF la liquidación y las conciliaciones, y el mes queda bloqueado. Solo el Gerente General lo reabre, con motivo.</p>' +
    tabla(['Mes'].concat(cts.map(c => c.nombre), ['Estado', '']), meses.reverse().map(m => {

  const abierto = f => { if (K.mesCerrado(String(f || '').slice(0, 7) + '-01', D.cierres)) err('El mes ' + String(f).slice(0, 7) + ' está cerrado. Solo el Gerente General puede reabrirlo.'); };
  const A = {
    ctb_global: () => ({ hoy: hoyD, torres: [{ torre: T, emitido_mes: 0, cobrado_mes: 0, vencido: K.antiguedad(D.recibos, D.cobros, hoyD).vencido, notificados: 1, ultimo_cierre: meses[1], usa: true },
      { torre: 'Torre Niza 7', emitido_mes: 412000, cobrado_mes: 298000, vencido: 186000, notificados: 2, ultimo_cierre: meses[1], usa: true }, { torre: 'Coral Park', emitido_mes: 0, cobrado_mes: 0, vencido: 0, notificados: 0, ultimo_cierre: '', usa: false }] }),
    ctb_datos: q => { if (q.torre !== T) err('En la demostración solo «' + T + '» tiene datos.'); return clonar(); },
    ctb_guardar: q => {
      const t = q.tabla, d = q.datos || {};
      if (t === 'config') { Object.assign(D.config, d); return clonar(); }
      if (q.operacion === 'catalogo') { if (D.rubros.length) err('Esta torre ya tiene su catálogo de rubros.'); D.rubros = q.lista.map((r, i) => Object.assign({ id: 'RUB-' + i }, r)); return clonar(); }
      if (q.operacion === 'crear') { const campo = { sin_identificar: 'fecha', ingresos: 'fecha', gastos: 'fecha', conceptos: 'periodo', acuerdos: 'fecha' }[t]; if (campo) abierto(d[campo]);
        if (t === 'cxp_rubro') { const p = D.pagos.find(x => x.id === d.cxp_id); Object.assign(p, { rubro: d.rubro, cuenta_id: d.cuenta_id }); return clonar(); }
        D[t].push(Object.assign({ id: id('CTB'), estado: t === 'sin_identificar' ? 'pendiente' : t === 'acuerdos' ? 'vigente' : 'activo', creado_por: 'Demostración' }, d)); audit('crear', t, ''); return clonar(); }
      if (q.operacion === 'editar') { const f = D[t].find(x => x.id === q.id); Object.assign(f, d); audit('editar', t, q.id); return clonar(); }
      if (q.operacion === 'anular') { const f = D[t].find(x => x.id === q.id); abierto(f.emision || f.fecha || f.periodo);
        if (t === 'recibos' && (K.aplicadoPorRecibo(D.cobros)[f.id] || 0) > 0) err('Ese recibo tiene cobros aplicados. Anule primero esos cobros.');
        f.estado = 'anulado'; f.motivo = q.motivo;
        if (t === 'cobros' && f.origen === 'sin_identificar') { const s = D.sin_identificar.find(x => x.id === f.origen_id); if (s) s.estado = 'pendiente'; }
        if (t === 'cobros' && f.origen === 'notificado') { const s = D.notificados.find(x => x.id === f.origen_id); if (s) s.estado = 'pendiente'; }
        D.anulaciones.push({ fecha: hoyD, tabla: t, registro: f.id, detalle: f.numero || f.detalle || f.apartamento || f.nombre || '', monto: f.monto || f.total, motivo: q.motivo, usuario: 'Demostración' }); return clonar(); }
    },
    ctb_recibos: q => {
      let s = Number(D.config.serie_siguiente) || serie; if (s < serie) s = serie;
      const mapa = {};
      q.recibos.forEach(r => { abierto(r.emision); if ((r.tipo === 'ordinaria' || r.tipo === 'mora') && D.recibos.some(x => K.activo(x) && x.apartamento === r.apartamento && x.periodo === q.periodo && x.tipo === r.tipo)) err('El apto. ' + r.apartamento + ' ya tiene recibo de ' + q.periodo + '.');
        const o = Object.assign({ id: id('REC'), numero: (D.config.serie_prefijo || 'R') + String(s++).padStart(6, '0'), periodo: q.periodo, estado: 'emitido' }, r); D.recibos.push(o); mapa[r.apartamento + '|' + r.tipo] = o; });
      D.config.serie_siguiente = String(s); serie = s;
      (q.cruces || []).forEach(k => { const disp = K.aFavor(D.cobros)[k.apartamento] || 0, pedido = k.aplicaciones.reduce((t, x) => t + Math.max(0, Number(x.monto) || 0), 0), nuevos = Object.values(mapa).filter(r => r.apartamento === k.apartamento);
        const cr = nuevos.length && disp > 0 ? K.cruzarAnticipo({ apartamento: k.apartamento, disponible: Math.min(disp, pedido), pendientes: K.conSaldo(nuevos, []), fecha: k.fecha, config: D.config }) : null;
        if (cr) D.cobros.push(Object.assign({ id: id('COB'), estado: 'activo' }, cr)); });
      return clonar();
    },
    ctb_cobrar: q => {
      const k = q.cobro; abierto(k.fecha);
      if (!(k.monto > 0)) err('El monto debe ser mayor que cero.');
      const sald = K.conSaldo(D.recibos, D.cobros, null, D.config); let suma = 0; const usado = {};
      k.aplicaciones.forEach(x => { const r = sald.find(y => y.id === x.recibo_id), l = r && r.lineas[x.linea]; if (!l) err('Cada monto aplicado debe decir a qué línea del recibo va.');
        const key = x.recibo_id + '#' + x.linea; usado[key] = (usado[key] || 0) + K.c(x.monto) + K.c(x.descuento || 0); if (usado[key] > K.c(l.saldo)) err('«' + l.concepto + '» del recibo ' + r.numero + ' solo tiene ' + l.saldo + ' pendiente.'); suma += K.c(x.monto); });
      let cuenta = k.cuenta_id;
      if (k.origen === 'sin_identificar') { const s = D.sin_identificar.find(x => x.id === k.origen_id); s.estado = 'identificado'; cuenta = s.cuenta_id; }
      const nuevo = { id: id('COB'), fecha: k.fecha, apartamento: k.apartamento, monto: k.monto, forma: k.forma, cuenta_id: cuenta, referencia: k.referencia, origen: k.origen, origen_id: k.origen_id, aplicaciones: k.aplicaciones, descuento: K.p(k.aplicaciones.reduce((t, x) => t + K.c(x.descuento || 0), 0)), a_favor: K.p(K.c(k.monto) - suma), estado: 'activo' };
      D.cobros.push(nuevo);
      if (k.origen === 'sin_identificar') D.sin_identificar.find(x => x.id === k.origen_id).cobro_id = nuevo.id;
      if (k.origen === 'notificado') Object.assign(D.notificados.find(x => x.id === k.origen_id), { estado: 'aprobado', cobro_id: nuevo.id, revisado_por: 'Demostración' });
      // v3.2 · recibo automático (en la demostración no sale nada)
      const c = D.contactos.find(x => x.apartamento === k.apartamento) || {}, canales = [];
      if (D.bot.vinculos.some(v => v.apartamento === k.apartamento)) canales.push({ canal: 'telegram', estado: 'pendiente' });
      if (c.telefono) { canales.push({ canal: 'whatsapp', estado: 'manual' }); D.mensajes.push({ id: id('MSJ'), apartamento: k.apartamento, canal: 'whatsapp', tipo: 'recibo', destino: c.telefono, texto: 'Recibimos su pago de ' + dinero(k.monto) + '. Constancia ' + nuevo.id + '.', estado: 'manual', cobro_id: nuevo.id, creado_en: new Date().toISOString().slice(0, 16) }); }
      if (c.correo) canales.push({ canal: 'correo', estado: 'enviado' });
      const r = clonar(); r.envio_recibo = { canales, whatsapp: c.telefono ? 'https://wa.me/1' + c.telefono.replace(/\D/g, '') + '?text=' + encodeURIComponent('Recibimos su pago de ' + dinero(k.monto) + '. Constancia ' + nuevo.id + '. Gracias.') : '', aviso: canales.length ? '' : 'El apto. no tiene teléfono, correo ni Telegram registrados.' };
      return r;
    },
    // v3.2 · cobros
    ctb_gestion: q => { const g = q.gestion; if (!g.resultado) err('Elija el resultado de la gestión.'); if (g.resultado === 'promesa' && !g.promesa_fecha) err('La fecha prometida no es válida (use el calendario).');
      const o = Object.assign({ id: id('GES'), fecha: new Date().toISOString().slice(0, 16), tipo: g.canal, creado_por: 'Demostración', estado: 'activa' }, g); delete o.enviar_encuesta; let enc = null;
      if (g.enviar_encuesta && K.esContacto(g.resultado)) { if (D.encuestas.some(e => e.apartamento === g.apartamento && Date.now() - Date.parse(e.enviada_en) < 30 * 864e5)) enc = { estado: 'omitida', aviso: 'No se envió la encuesta: el apto. ' + g.apartamento + ' ya recibió una en los últimos 30 días.' };
        else { const e = { id: id('ENC'), apartamento: g.apartamento, gestor: 'Demostración', canal: 'whatsapp', enviada_en: new Date().toISOString().slice(0, 16) }; D.encuestas.push(e); o.encuesta_id = e.id; const c = D.contactos.find(x => x.apartamento === g.apartamento);
          const txt = 'Saludos. ¿Nos regala 30 segundos para decirnos cómo le atendimos en cobros? ' + location.href.replace(/contabilidad\.html.*$/, 'encuesta-cobros.html?demo=1');
          D.mensajes.push({ id: id('MSJ'), apartamento: g.apartamento, canal: 'whatsapp', tipo: 'encuesta', destino: c ? c.telefono : '', texto: txt, estado: c ? 'manual' : 'pendiente', creado_en: new Date().toISOString().slice(0, 16) });
          enc = c ? { estado: 'manual', whatsapp: 'https://wa.me/1' + c.telefono.replace(/\D/g, '') + '?text=' + encodeURIComponent(txt) } : { estado: 'sin_canal', aviso: 'El apto. no tiene teléfono registrado.' }; } }
      D.gestiones.push(o); const r = clonar(); r.encuesta = enc; return r; },
    ctb_gestion_anular: q => { D.gestiones.find(g => g.id === q.id).estado = 'anulado'; return clonar(); },
    ctb_contacto: q => { const c = q.contacto; if (c.telefono && String(c.telefono).replace(/\D/g, '').length !== 10) err('El teléfono debe tener 10 dígitos (809, 829 u 849).'); const x = D.contactos.find(y => y.apartamento === c.apartamento); if (x) Object.assign(x, c); else D.contactos.push(Object.assign({ id: id('CON') }, c)); return clonar(); },
    ctb_contactos_importar: () => { const r = clonar(); r.aviso = 'No había contactos nuevos para traer.'; return r; },
    ctb_mensaje: q => { const c = D.contactos.find(x => x.apartamento === q.apartamento) || {}; const m = { id: id('MSJ'), apartamento: q.apartamento, canal: q.canal, tipo: q.tipo, destino: q.canal === 'whatsapp' ? c.telefono : c.correo, texto: q.texto, estado: q.canal === 'whatsapp' ? 'manual' : q.canal === 'telegram' ? 'pendiente' : 'enviado', creado_en: new Date().toISOString().slice(0, 16) };
      D.mensajes.push(m); D.gestiones.push({ id: id('GES'), fecha: m.creado_en, apartamento: q.apartamento, tipo: q.canal, canal: q.canal, resultado: 'enviado', nota: q.texto.slice(0, 120), creado_por: 'Demostración', estado: 'activa' });
      const r = clonar(); r.envio = { estado: m.estado, whatsapp: q.canal === 'whatsapp' && c.telefono ? 'https://wa.me/1' + c.telefono.replace(/\D/g, '') + '?text=' + encodeURIComponent(q.texto) : '' }; return r; },
    ctb_mensaje_estado: q => { const m = D.mensajes.find(x => x.id === q.id); m.estado = q.estado; const h = new Date().toISOString().slice(0, 16); if (q.estado === 'enviado') m.enviado_en = h; if (q.estado === 'leido') m.leido_en = h; if (q.estado === 'respondido') m.respondido_en = h; return clonar(); },
    ctb_recibo_reenviar: () => { const r = clonar(); r.envio_recibo = { canales: [{ canal: 'correo', estado: 'enviado' }] }; return r; },
    ctb_bot_invitar: q => { const enlace = 'https://t.me/StiliCobrosBot?start=cDEMO' + q.apartamento; const texto = 'Saludos. Consulte su saldo, envíe su comprobante y pida su recibo por Telegram: ' + enlace; return { enlace, texto, whatsapp: 'https://wa.me/?text=' + encodeURIComponent(texto) }; },
    ctb_bot_desvincular: q => { D.bot.vinculos = D.bot.vinculos.filter(v => v.apartamento !== q.apartamento); return clonar(); },
    ctb_reporte: q => { const r = K.reporteMedida(D, q.filtros); return { titulo: r.titulo, total: r.resumen.total, torres: [{ torre: T, total: r.resumen.total, resumen: r.resumen }, { torre: 'Torre Niza 7 (ejemplo)', total: K.r2(r.resumen.total * 1.7), resumen: Object.assign({}, r.resumen, { apartamentos: 9, pct_apartamentos: 22.5, indice: 9.4 }) }] }; },
    ctb_notificado_rechazar: q => { Object.assign(D.notificados.find(x => x.id === q.id), { estado: 'rechazado', motivo: q.motivo, revisado_por: 'Demostración' }); return clonar(); },
    ctb_extracto: q => { let nuevos = 0; q.movimientos.forEach(m => { if (!D.extracto.some(x => x.cuenta_id === q.cuenta_id && x.fecha === m.fecha && x.monto === m.monto && x.referencia === m.referencia)) { D.extracto.push(Object.assign({ id: id('MOV'), cuenta_id: q.cuenta_id, estado: 'pendiente' }, m)); nuevos++; } }); const r = clonar(); r.aviso = nuevos + ' movimientos nuevos.'; return r; },
    ctb_conciliar: q => { abierto(q.periodo + '-01');
      const hechos = D.conciliaciones.filter(k => K.activo(k) && k.cuenta_id === q.cuenta_id).reduce((a, k) => a.concat(k.claves || []), []);
      const r = K.conciliar({ cuentaId: q.cuenta_id, d: Object.assign({}, D), periodo: q.periodo, extracto: D.extracto.filter(x => x.cuenta_id === q.cuenta_id && x.estado !== 'conciliado'), saldoBanco: q.saldo_banco, parejas: q.parejas, yaConciliados: hechos });
      if (!r.lista) err('No cuadra: diferencia de ' + r.diferencia + '.');
      const ids = r.emparejados.filter(e => e.banco).map(e => e.banco.id);
      D.conciliaciones.push({ id: id('CNC'), cuenta_id: q.cuenta_id, periodo: q.periodo, saldo_banco: r.saldo_banco, saldo_libros: r.saldo_libros, transito: r.total_transito, no_cobrados: r.total_no_cobrados, claves: r.emparejados.map(e => e.libro.clave), extracto_ids: ids, estado: 'conciliada', creado_por: 'Demostración' });
      D.extracto.filter(x => ids.indexOf(x.id) >= 0).forEach(x => { x.estado = 'conciliado'; }); return clonar(); },
    ctb_cerrar: q => { D.cierres = D.cierres.filter(k => k.periodo !== q.periodo); D.cierres.push({ id: id('CIE'), periodo: q.periodo, estado: 'cerrado', por: 'Demostración', archivos: [] }); return clonar(); },
    ctb_reabrir: q => { Object.assign(D.cierres.find(k => k.periodo === q.periodo), { estado: 'reabierto', motivo: q.motivo }); return clonar(); },
    ctb_aprobacion_pedir: q => { let a = D.aprobaciones.find(x => x.cxp_id === q.cxp_id); if (!a) { const p = D.pagos.find(x => x.id === q.cxp_id); a = { id: id('APR'), cxp_id: p.id, suplidor: p.suplidor, monto: p.monto, estado: 'pendiente' }; D.aprobaciones.push(a); p.junta = 'pendiente'; } const r = clonar(); r.enlace_junta = location.href.replace(/contabilidad\.html.*$/, 'aprobar.html?demo=1&t=demo'); return r; },
    ctb_honorario: q => { if (D.pagos.some(p => p.concepto === 'Honorarios de administración ' + q.periodo)) err('Los honorarios de ' + q.periodo + ' ya están en Cuentas por Pagar.');
      D.pagos.push({ id: id('CXP'), suplidor: 'Stili Group · Honorarios de administración', concepto: 'Honorarios de administración ' + q.periodo, monto: Number(D.config.honorario_monto), estado: 'pendiente', fecha: hoyD, rubro: 'E4.1', cuenta_id: '' }); return clonar(); },
    ctb_informe_ia: q => new Promise(ok => setTimeout(() => ok({ texto: 'En ' + mesTxt(q.periodo) + ' la torre cobró ' + din0(q.cifras.liquidacion.ingresos_mes) + ' y pagó ' + din0(q.cifras.liquidacion.egresos_mes) + ', con un resultado de ' + din0(q.cifras.liquidacion.resultado_mes) + '. (Texto de ejemplo: en el sistema real lo redacta la IA con estas mismas cifras.)\n\nLa cartera vencida suma ' + din0(q.cifras.cartera.vencida) + '; ' + din0(q.cifras.cartera.mas_de_90_dias) + ' tiene más de 90 días y está en gestión con acuerdos de pago.\n\nLa Junta debe decidir la aprobación del overhaul de la planta eléctrica (RD$ 86,500), que supera el monto fijado para pagos sin aprobación.' }), 700)),
  };
  return { llamar: (accion, q) => { if (!A[accion]) throw new Error('Acción no disponible en la demostración: ' + accion); return new Promise((ok, mal) => setTimeout(() => { try { ok(A[accion](q)); } catch (e) { mal(e); } }, 120)); } };
})();

// ------------------------------------------------------------------ arranque
if (!DEMO && !StiliModulos.leer().sesion) { StiliModulos.montar(document.body, 'contabilidad'); $('#contenido').innerHTML = '<div class="card entrar"><h2>Contabilidad</h2><p>Entre con su usuario de Stili en el Portal.</p><a class="btn primario" href="portal/">Entrar en Stili Soft</a> <a class="btn" href="?demo=1">Ver la demostración</a></div>'; }
else { StiliModulos.montar(document.body, 'contabilidad'); iniciar(); }
</script>
