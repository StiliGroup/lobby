function adivinar(desc) {

  let mejor = null, pm = 0;
  D.catalogo.contactos.filter(c => !c.tipos.length || c.tipos.indexOf('client') >= 0).forEach(c => { const n = new Set(sinT(c.nombre).split(/\s+/)); const p = pal.filter(w => n.has(w)).length; if (p > pm) { pm = p; mejor = c; } });
  return mejor;
}

      await hacer('conc_subir', { cuenta_id: v('cuenta_id'), mes: v('mes'), nombre: a.name, mime: a.type || (/\.csv$/i.test(a.name) ? 'text/csv' : ''), contenido: await leerArchivo(a) }, b); return;
    }
    if (f.id === 'f-enviar') {
      const est = v('estado'); if (!confirm(est === 'open' ? '¿Crear la conciliación cerrada en Alegra?' : '¿Crear la conciliación como borrador en Alegra?')) return;
      await hacer('conc_enviar', { id: f.dataset.id, saldo_banco: Number(v('saldo_banco').replace(/,/g, '')), estado: est }, b); return;
    }
  } catch (er) { /* el aviso ya se mostró */ }
});
tab = TABS.some(x => x[0] === location.hash.slice(1)) ? location.hash.slice(1) : 'inicio';
StiliModulos.montar(document.body, 'empresa');
if (!DEMO && !StiliModulos.leer().sesion) $('#contenido').innerHTML = '<div class="card entrar"><h2>Stili Group · Empresa</h2><p>Entre con su usuario de Stili en el Portal.</p><a class="btn primario" href="portal/">Entrar en Stili Soft</a></div>';
else cargar();
</script>
