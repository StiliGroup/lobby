<!doctype html>
<html lang="es-DO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Torres · Stili Soft</title>
<meta name="description" content="Módulo Torres de Stili Group: ficha de cada torre, finanzas, proveedores, contratos, reclamaciones y comunicados.">
<meta name="theme-color" content="#003A75">
<link rel="icon" href="portal/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap">
<script src="config.js"></script>
<script src="stili-modulos.js?v=3.5"></script>
<script src="stili-vigia.js?v=3.0"></script>
<link rel="stylesheet" href="stili-estilo.css?v=3.0">
</head>
<body>
<header class="cabecera">
  <div class="fila gutter">
    <div class="titulo"><small>Stili Group · Módulo</small><b>Torres</b></div>
    <a class="btn-nueva enlace" id="b-tareas" href="tareas.html" hidden>Tareas por gestor</a>
    <button type="button" class="btn-nueva" id="b-nueva" hidden>+ Nueva torre</button>
    <div class="selector" id="selector" hidden>
      <button type="button" id="sel-boton" aria-haspopup="listbox" aria-expanded="false"><span><span id="sel-nombre">Elija una torre</span><small id="sel-gestor"></small></span><span class="flecha">▾</span></button>
      <div class="lista" id="sel-lista" hidden>
        <div class="buscar"><input type="search" id="sel-buscar" placeholder="Buscar torre o gestor…" autocomplete="off" aria-label="Buscar torre"></div>
        <div class="grupos" id="sel-grupos" role="listbox"></div>
      </div>
    </div>
  </div>
</header>
<div class="secciones gutter" id="secciones" hidden><nav id="tabs" aria-label="Secciones de la torre"></nav></div>

<dialog id="dlg-nueva"><form class="cuerpo" id="f-nueva" method="dialog">
  <h2>Nueva torre</h2>
  <p class="nota" style="margin-top:0">La torre se crea aquí, una sola vez, y aparece en todos los módulos: Torres, Lobby y Finanzas.</p>
  <div class="form">
    <label class="ancho">Nombre de la torre<input name="torre" required placeholder="Torre Mirador 3" maxlength="80"></label>
    <label>Gestor responsable<select name="gestor_id" id="n-gestor"></select></label>
    <label>RNC<input name="rnc" inputmode="numeric"></label>
    <label class="ancho">Dirección<input name="direccion"></label>
    <label>Cantidad de apartamentos<input name="cantidad_aptos" inputmode="numeric"></label>
    <label>Administración de Stili desde<input name="contrato_stili_desde" type="date"></label>
    <p class="nota ancho" style="margin:4px 0 0"><b>Apartamentos del lobby</b> (opcional): para que el lobby registre visitas y huéspedes.</p>
    <label>Piso desde<input name="piso_desde" inputmode="numeric" value="1"></label>
    <label>Piso hasta<input name="piso_hasta" inputmode="numeric"></label>
    <label>Letras por piso<input name="letras" value="A,B,C,D"></label>
    <label class="ancho">…o pegue la lista de apartamentos<textarea name="lista" placeholder="1A 1B 2A 2B PH1"></textarea></label>
  </div>
  <div class="acciones-fila"><button class="btn primario" value="crear" id="n-crear">Crear torre</button><button class="btn" value="cancelar" formnovalidate>Cancelar</button></div>
  <p class="nota" id="n-msg" role="status"></p>
</form></dialog>
<main class="gutter" id="contenido">
  <p class="nota">Cargando…</p>
</main>

<script>
const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LS = 'stili-admin';
const cfg = () => { try { return JSON.parse(localStorage.getItem(LS) || '{}'); } catch (e) { return {}; } };
const guardar = c => { try { localStorage.setItem(LS, JSON.stringify(Object.assign(cfg(), c))); } catch (e) { /* sin almacenamiento */ } };
const DEMO = new URLSearchParams(location.search).has('demo');
const S = { lista: null, torre: null, detalle: null, seccion: 'general' };

// v2.6.3 · barra de progreso: se ve cada vez que el sistema está trabajando (y con porcentaje en los lotes)
const Progreso = (() => {
  let n = 0, t = null, el = null;
  const barra = () => el || (el = Object.assign(document.body.appendChild(document.createElement('div')), { id: 'progreso', innerHTML: '<i></i><span></span>' }));
  return {
    inicio() { n++; clearTimeout(t); t = setTimeout(() => { if (n) barra().className = 'activo indet'; }, 250); },
    fin() { n = Math.max(0, n - 1); if (!n) { clearTimeout(t); if (el && !el.dataset.fijo) el.className = ''; } },
    avance(hechas, total, texto) { const b = barra(); b.dataset.fijo = '1'; b.className = 'activo'; b.querySelector('i').style.width = Math.round(100 * hechas / Math.max(1, total)) + '%';
      b.querySelector('span').textContent = texto || ''; },
    listo() { if (el) { delete el.dataset.fijo; el.className = ''; el.querySelector('i').style.width = '0'; el.querySelector('span').textContent = ''; } },
  };
})();
async function api(accion, datos) {
  Progreso.inicio();
  try { return await api0(accion, datos); } finally { Progreso.fin(); }
}
async function api0(accion, datos) {
  if (DEMO) { if (!Demo[accion]) throw new Error('En la demostración esta acción no se guarda.'); return Demo[accion](datos || {}); }
  const url = cfg().url || (window.STILI && window.STILI.servicio) || '';
  const r = await fetch(url, { method: 'POST', body: JSON.stringify(Object.assign({ accion, sesion: cfg().sesion || '' }, datos || {})) });
  const j = await r.json();
  if (!j.ok) { const e = new Error(j.error || 'Error del servicio'); e.codigo = j.codigo; throw e; }
  return j;
}

// v2.3 · velocidad: lo último que vio aparece al instante y se actualiza en segundo plano.
// No se guardan en el equipo los accesos institucionales ni la banca en línea.
const MEMO = 'stili-torres-' + String(cfg().sesion || '').split('.')[0];
function memoria(k) { try { return (JSON.parse(localStorage.getItem(MEMO) || '{}'))[k] || null; } catch (e) { return null; } }
function recordar(k, v) {
  try {
    const m = JSON.parse(localStorage.getItem(MEMO) || '{}');
    if (v && typeof v === 'object') { v = Object.assign({}, v); delete v.accesos; delete v.bancos; }
    m[k] = v; const txt = JSON.stringify(m);
    if (txt.length < 3e6) localStorage.setItem(MEMO, txt);
  } catch (e) { /* sin almacenamiento */ }
}
const ocupado = () => !!(S.editando || (document.activeElement && document.activeElement.closest && document.activeElement.closest('#contenido form')));

// ------------------------------------------------------------------ Selector de torres (agrupado por gestor, con buscador)
const plural = (n, uno, varios) => n + ' ' + (n === 1 ? uno : varios);
function sinTildes(t) { return String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
function pintarLista() {
  const q = sinTildes($('#sel-buscar').value.trim());
  const grupos = {};
  S.lista.torres.filter(t => !q || sinTildes(t.torre + ' ' + t.gestor + ' ' + t.direccion + ' ' + t.clave).includes(q))
    .forEach(t => { (grupos[t.gestor] = grupos[t.gestor] || []).push(t); });
  const nombres = Object.keys(grupos).sort((a, b) => a === 'Sin gestor asignado' ? 1 : b === 'Sin gestor asignado' ? -1 : sinTildes(a) < sinTildes(b) ? -1 : 1);
  $('#sel-grupos').innerHTML = nombres.map(g => '<details open><summary>' + esc(g) + ' <span>' + grupos[g].length + '</span></summary>' +
    grupos[g].map(t => '<button type="button" class="t" role="option" data-clave="' + esc(t.clave) + '" aria-selected="' + (S.torre === t.clave) + '"><span>' + esc(t.torre) +
      (t.direccion ? '<br><small>' + esc(t.direccion) + '</small>' : '') + '</span>' + (t.abiertas ? '<span class="chip rojo" title="Reclamaciones abiertas">' + t.abiertas + '</span>' : '') + '</button>').join('') +
    '</details>').join('') || '<div class="vacio">No hay torres con ese nombre.</div>';
}
function abrirLista(abrir) {
  $('#sel-lista').hidden = !abrir; $('#sel-boton').setAttribute('aria-expanded', String(abrir));
  if (abrir) { $('#sel-buscar').value = ''; pintarLista(); setTimeout(() => $('#sel-buscar').focus(), 30); }
}
$('#sel-boton').addEventListener('click', e => { e.stopPropagation(); abrirLista($('#sel-lista').hidden); });
$('#sel-buscar').addEventListener('input', pintarLista);
$('#sel-buscar').addEventListener('keydown', e => { if (e.key === 'Enter') { const b = $('#sel-grupos .t'); if (b) b.click(); } });
$('#sel-grupos').addEventListener('click', e => { const b = e.target.closest('.t'); if (!b) return; abrirLista(false); abrirTorre(b.dataset.clave); });
document.addEventListener('click', e => { if (!$('#selector').contains(e.target)) abrirLista(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') abrirLista(false); });

// ------------------------------------------------------------------ Secciones de la torre
// v2.1 · en el orden en que más se usan. Apartamentos, Personal y Reglamentos se trajeron del Lobby.
const SECCIONES = [
  ['tablero', 'Tablero del condominio'],
  ['reclamaciones', 'Reclamaciones y comunicados'], ['tareas', 'Tareas y levantamientos'], ['pedidos', 'Pedidos de limpieza'], ['finanzas', 'Finanzas y presupuesto'], ['cxp', 'Cuentas por pagar'], ['cxc', 'Cuentas por cobrar'], ['proveedores', 'Proveedores y contratos'],
  ['apartamentos', 'Apartamentos'], ['personal', 'Personal del lobby'], ['junta', 'Junta Directiva'], ['accesos', 'Accesos y servicios'],
  ['documentos', 'Reglamentos y documentos'], ['general', 'Generales y legales'], ['historial', 'Notas e historial'],
];
const CORTO = { tablero: 'Tablero', cxc: 'Por cobrar', reclamaciones: 'Reclamaciones', tareas: 'Tareas', pedidos: 'Pedidos', finanzas: 'Finanzas', cxp: 'Por pagar', proveedores: 'Proveedores', apartamentos: 'Apartamentos', personal: 'Personal', junta: 'Junta',
  accesos: 'Accesos', documentos: 'Reglamentos', general: 'Generales', historial: 'Historial' };   // en el teléfono
const SECCION_VIEJA = { presupuesto: 'finanzas', contratos: 'proveedores', comunicados: 'reclamaciones', empleados: 'personal', notas: 'historial' };
const lobby = () => (S.lista && S.lista.lobby) || {};
// v2.7 · la misma pantalla de la torre sirve a cinco módulos; cada uno ve solo sus secciones
const MODULO_SECCIONES = {
  // v2.8 · Condominios es la ficha completa de la torre: todo lo de esa torre en un solo lugar (cada dato se guarda en su módulo)
  inicio: ['tablero', 'general', 'junta', 'apartamentos', 'personal', 'proveedores', 'documentos', 'accesos', 'finanzas', 'cxp', 'cxc', 'reclamaciones', 'tareas', 'pedidos', 'historial'],
  operaciones: ['reclamaciones', 'tareas', 'pedidos', 'proveedores'],
  finanzas: ['finanzas', 'cxp', 'cxc'],
  personal: ['personal'],
  lobby: ['apartamentos', 'accesos', 'documentos'],
};
const NOMBRE_MODULO = { inicio: 'Condominios', operaciones: 'Operaciones', finanzas: 'Finanzas', personal: 'Personal', lobby: 'Lobby' };
const MODULO = (() => {
  const m = new URLSearchParams(location.search).get('m');
  if (MODULO_SECCIONES[m]) return m;
  // enlaces viejos (#TORRE/seccion): el módulo es el de la sección
  const sec = SECCION_VIEJA[(decodeURIComponent(location.hash.slice(1)).split('/')[1] || '')] || decodeURIComponent(location.hash.slice(1)).split('/')[1];
  const k = Object.keys(MODULO_SECCIONES).find(x => MODULO_SECCIONES[x].includes(sec)) || 'inicio';
  try { const u = new URL(location.href); u.searchParams.set('m', k); history.replaceState(null, '', u); } catch (e) { /* nada */ }
  return k;
})();
document.title = NOMBRE_MODULO[MODULO] + ' · Stili Soft';
function tieneSeccion(k, d) {
  if (!MODULO_SECCIONES[MODULO].includes(k)) return false;
  const ficha = d.ver_ficha !== false;
  if (k === 'tablero') return true;
  if (k === 'cxc') return !!(S.lista && S.lista.cobros);
  if (k === 'reclamaciones') return !!d.reclamaciones;
  if (k === 'tareas') return !!(S.lista && S.lista.tareas > 0);
  if (k === 'pedidos') return !!(S.lista && S.lista.pedidos > 0);
  if (k === 'finanzas') return ficha || !!(S.lista && (S.lista.finanzas || S.lista.presupuesto));
  if (k === 'cxp') return !!(S.lista && S.lista.finanzas);
  if (k === 'apartamentos') return lobby().apartamentos > 0;
  if (k === 'personal') return lobby().personal > 0 || (ficha && d.empleados.length > 0);
  if (k === 'documentos') return true;
  return ficha;
}
const primeraSeccion = d => (SECCIONES.find(([k]) => tieneSeccion(k, d)) || [MODULO_SECCIONES[MODULO][0]])[0];
// Secciones del lobby: la misma pantalla del Lobby, dentro de la torre y con la torre ya elegida
const marco = (v, titulo) => '<iframe class="marco-lobby" title="' + esc(titulo) + '" src="admin.html?m=torre&embed=1&torre=' + encodeURIComponent(S.detalle.torre) + (DEMO ? '&demo=1' : '') + '#' + v + '"></iframe>';
window.addEventListener('message', e => {
  if (e.origin !== location.origin || !e.data || !e.data.stiliAltura) return;
  $$('iframe.marco-lobby').forEach(f => { if (e.source === f.contentWindow) f.style.height = Math.max(300, e.data.stiliAltura) + 'px'; });
});
function pintarTabs() {
  const d = S.detalle;
  const corto = window.matchMedia('(max-width: 700px)').matches;
  const orden = MODULO_SECCIONES[MODULO];   // v2.8 · las pestañas en el orden del módulo (Condominios: primero la torre, luego dinero y operación)
  if (window.StiliModulos && StiliModulos.marcar) StiliModulos.marcar({ torre: { seccion: S.seccion, cxpTab: S.seccion === 'cxp' ? cxpTabActual() : '' } });
  $('#tabs').innerHTML = SECCIONES.filter(([k]) => tieneSeccion(k, d)).sort((x, y) => orden.indexOf(x[0]) - orden.indexOf(y[0])).map(([k, n]) => '<button type="button" data-s="' + k + '" aria-selected="' + (S.seccion === k) + '" title="' + esc(n) + '">' + esc(corto ? CORTO[k] : n) +
    (k === 'reclamaciones' && d.reclamaciones && d.reclamaciones.resumen.abiertas ? '<span class="n">' + d.reclamaciones.resumen.abiertas + '</span>' : '') +
    (k === 'tareas' && d.tareas_abiertas ? '<span class="n">' + d.tareas_abiertas + '</span>' : '') +
    (k === 'proveedores' && d.contratos.some(c => c.dias !== null && c.dias <= 30) ? '<span class="n">' + d.contratos.filter(c => c.dias !== null && c.dias <= 30).length + '</span>' : '') + '</button>').join('');
  $('#secciones').hidden = false;
  StiliModulos.mas($('#tabs'), { items: ':scope > button' });
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button[data-s]'); if (b) verSeccion(b.dataset.s); });
// «Datos por completar»: cada dato lleva a su sección (y abre el editor de la ficha cuando aplica)
document.addEventListener('click', e => {
  const b = e.target.closest('[data-ir]'); if (!b || !S.detalle) return;
  const k = b.dataset.ir;
  if (!MODULO_SECCIONES[MODULO].includes(k)) {   // v2.7.2 · el dato es de otro módulo: se abre ese módulo en la misma torre
    const m = Object.keys(MODULO_SECCIONES).find(x => x !== 'inicio' && MODULO_SECCIONES[x].includes(k)) || 'inicio';
    location.href = 'torres.html?m=' + m + (DEMO ? '&demo=1' : '') + '#' + encodeURIComponent(S.torre) + '/' + k; return;
  }
  if (!tieneSeccion(k, S.detalle)) return;
  if ((k === 'general' || k === 'finanzas') && S.detalle.puede_editar && k === 'general') S.editando = 'general';
  verSeccion(k); $('#seccion').scrollIntoView({ behavior: 'smooth', block: 'start' });
});
function verSeccion(k) {
  document.body.classList.toggle('ancho', k === 'cxp');
  S.seccion = k; guardar({ torre_seccion: k, ['seccion_' + MODULO]: k });
  if (window.StiliModulos && StiliModulos.marcar) StiliModulos.marcar({ torre: { seccion: k, cxpTab: k === 'cxp' ? cxpTabActual() : '' } });
  $$('#tabs > button[data-s]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.s === k)));
  StiliModulos.mas($('#tabs'), { items: ':scope > button' });
  pintarSeccion();
}

const campos = lista => '<dl class="campos">' + lista.map(c => '<div><dt>' + esc(c.etiqueta) + '</dt><dd' + (c.valor ? '' : ' class="falta"') + '>' +
  (c.valor ? (c.clave === 'mapa_url' && /^https?:\/\//.test(c.valor) ? '<a href="' + esc(c.valor) + '" target="_blank" rel="noopener">Abrir mapa ↗</a>' : esc(c.valor)) : 'Sin dato') + '</dd></div>').join('') + '</dl>';
const tabla = (cols, filas, vacio) => filas.length ? '<div class="tabla"><table><thead><tr>' + cols.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr></thead><tbody>' + filas.join('') + '</tbody></table></div>' : '<div class="vacio">' + esc(vacio) + '</div>';
const tel = t => t ? '<a href="tel:' + esc(String(t).replace(/[^\d+]/g, '')) + '">' + esc(t) + '</a>' : '';
function estadoChip(e) { return e === 'abierta' ? '<span class="chip rojo">Abierta</span>' : e.indexOf('notific') === 0 ? '<span class="chip ambar">Notificada</span>' : e.indexOf('cerrad') === 0 ? '<span class="chip verde">Cerrada</span>' : '<span class="chip">' + esc(e) + '</span>'; }

function pintarSeccion() {
  const d = S.detalle, k = S.seccion;
  let h = '';
  if (k === 'general') h = S.editando === 'general' ? formFicha('general') : '<div class="card"><div class="cab"><h2>Generales y legales</h2>' + (d.puede_editar ? '<button class="btn" data-editar="general">Editar</button>' : '') + '</div>' + campos(d.general.filter(c => c.clave !== 'gestor')) + '</div>';
  if (k === 'finanzas') {
    const datos = d.ver_ficha === false ? '' : S.editando === 'finanzas' ? formFicha('finanzas') : '<div class="card"><div class="cab"><h2>Datos financieros</h2>' + (d.puede_editar ? '<button class="btn" data-editar="finanzas">Editar</button>' : '') + '</div>' + campos(d.finanzas) +
      (d.nivel < 2 ? '<p class="nota">El número de cuenta completo lo ven quienes tienen el nivel «Profundizar» en Torres.</p>' : '') + '</div>';
    h = (S.lista.presupuesto ? '<div id="pres"><p class="nota">Cargando presupuesto…</p></div>' : '') + (S.lista.finanzas ? '<div id="fin"><p class="nota">Cargando estados y análisis…</p></div>' : '') + datos;
  }
  if (k === 'junta') h = pintarJunta(d);
  if (k === 'accesos') h = '<div class="card"><h2>Servicios (códigos de cliente)</h2>' + tabla(['Servicio', 'Código', 'Notas'],
      (d.servicios || []).map(x => '<tr><td><b>' + esc(x.servicio) + '</b></td><td>' + esc(x.codigo) + '</td><td><small>' + esc(x.notas) + '</small></td></tr>'), 'Sin códigos de servicios.') + '</div>' +
    (d.accesos ? '<div class="card"><h2>Accesos institucionales</h2><p class="nota" style="margin-top:0">Las contraseñas nunca se guardan aquí: van en el <a href="claves.html">Gestor de claves</a> (cifradas y con registro de quién las ve).</p>' + tabla(['Entidad', 'Usuario', 'Nombre de usuario', 'Token', 'Última actualización', 'Notas'],
      d.accesos.map(x => '<tr><td><b>' + esc(x.entidad) + '</b></td><td>' + esc(x.usuario) + '</td><td>' + esc(x.nombre_usuario) + '</td><td>' + esc(x.token) + '</td><td>' + esc(x.ultima_actualizacion) + '</td><td><small>' + esc(x.notas) + '</small></td></tr>'), 'Sin accesos registrados.') + '</div>' +
      '<div class="card"><h2>Banca en línea</h2>' + tabla(['Banco', 'Titular', 'Usuario', 'Notas'], (d.bancos || []).map(x => '<tr><td>' + esc(x.banco) + '</td><td>' + esc(x.titular) + '</td><td>' + esc(x.usuario) + '</td><td><small>' + esc(x.notas) + '</small></td></tr>'), 'Sin datos de banca.') + '</div>'
    : '<p class="nota">Los accesos institucionales y de banca los ven quienes tienen el nivel «Profundizar» en Torres.</p>');
  if (k === 'proveedores') h = '<div class="card"><h2>Contratos y pólizas · ' + d.contratos.length + '</h2>' + tabla(['Tipo', 'Proveedor', 'Número', 'Vence', 'Monto', 'Frecuencia'],
    d.contratos.map(c => '<tr><td><b>' + esc(c.tipo) + '</b>' + (c.notas ? '<br><small>' + esc(c.notas) + '</small>' : '') + '</td><td>' + esc(c.proveedor) + '</td><td>' + esc(c.numero) + '</td><td>' + esc(c.vence) +
      (c.dias === null ? '' : c.dias < 0 ? ' <span class="chip rojo">Vencido</span>' : c.dias <= 30 ? ' <span class="chip ambar">En ' + c.dias + ' días</span>' : '') + '</td><td>' + esc(c.monto) + '</td><td>' + esc(c.frecuencia) + '</td></tr>'),
    'Todavía no hay contratos ni pólizas registrados.') + '</div>' +
    '<div class="card"><h2>Proveedores · ' + d.proveedores.length + '</h2>' + tabla(['Servicio', 'Empresa', 'Contacto', 'Teléfono', 'Correo', 'Notas'],
    d.proveedores.map(p => '<tr><td><b>' + esc(p.servicio) + '</b></td><td>' + esc(p.empresa) + '</td><td>' + esc(p.contacto) + '</td><td>' + tel(p.telefono) + '</td><td>' + (p.correo ? '<a href="mailto:' + esc(p.correo) + '">' + esc(p.correo) + '</a>' : '') + '</td><td><small>' + esc(p.notas) + '</small></td></tr>'),
    'Todavía no hay proveedores registrados para esta torre.') + '</div>';
  if (k === 'tareas') h = '<div id="tar"><p class="nota">Cargando tareas…</p></div>';
  if (k === 'pedidos') h = '<div id="ped"><p class="nota">Cargando pedidos…</p></div>';
  if (k === 'cxp') h = '<div id="cxp"><p class="nota">Cargando cuentas por pagar…</p></div>';

async function armarAccion(a, b) {
  const c = S.cxp, cand = candidatosCxp(c), saldo = montoTexto(S.cxpSaldo);
  if (a === 'todas') cand.forEach(p => S.cxpSel.add(p.id));
  if (a === 'ninguna') S.cxpSel.clear();
  if (a === 'sugerir') {
    if (saldo === null) return toast('Escriba primero el balance del banco.', true);
    S.cxpSel.clear(); let resta = saldo;
    const orden = p => ORDEN_TIPO.indexOf(tipoPagoDe(c, p));
    const fecha = p => { const m = String(p.factura_fecha || '').match(/(\d{2})\/(\d{2})\/(\d{4})/); return m ? m[3] + m[2] + m[1] : String(p.periodo || '') + '99'; };
    cand.filter(p => !p.alertas.some(x => x.nivel === 'rojo')).sort((x, y) => orden(x) - orden(y) || (fecha(x) < fecha(y) ? -1 : 1))
      .forEach(p => { if ((p.monto || 0) <= resta + 0.005) { S.cxpSel.add(p.id); resta -= p.monto || 0; } });
    toast(S.cxpSel.size + ' factura' + (S.cxpSel.size === 1 ? '' : 's') + ' caben en el balance. Revise y ajuste.');
  }
  if (a === 'crear') {
    const ids = cand.filter(p => S.cxpSel.has(p.id)).map(p => p.id), tot = cand.filter(p => S.cxpSel.has(p.id)).reduce((s, p) => s + aPagar(p), 0);
    const montos = {}; ids.forEach(id => { const p = cand.find(x => x.id === id); if (aPagar(p) < (p.monto || 0)) montos[id] = aPagar(p); });
    if (Object.keys(montos).length && !confirm(Object.keys(montos).length + ' factura' + (Object.keys(montos).length === 1 ? ' va' : 's van') + ' con avance. Lo que no se paga ahora queda como saldo pendiente, por relacionar. ¿Seguir?')) return;
    if (saldo === null) return toast('Escriba el balance del banco.', true);
    if (tot > saldo + 0.005 && !confirm('La relación (' + dinero2(tot) + ') pasa del balance del banco (' + dinero2(saldo) + ') por ' + dinero2(tot - saldo) + '. ¿Crearla de todos modos?')) return;
    b.disabled = true;
    try {
      S.cxp = await api('cxp_armar', { torre: S.torre, periodo: $('#armar-mes').value, titulo: $('#armar-titulo').value, saldo_banco: S.cxpSaldo, saldo_fecha: S.cxpSaldoFecha || new Date().toLocaleDateString('en-CA'), ids, montos });
      S.cxpSel.clear(); S.cxpMontos = {}; S.cxpNuevas = null; S.cxpPer = S.cxp.periodo; S.cxpRel = S.cxp.relacion_id; S.cxpTab = 'pagos'; pintarCxp();
      toast('Relación creada con ' + ids.length + ' pago' + (ids.length === 1 ? '' : 's') + '. Las demás facturas siguen por relacionar.');
    } catch (err) { b.disabled = false; toast(err.message, true); }
    return;
  }
  $$('.armar-chk').forEach(x => { x.checked = S.cxpSel.has(x.dataset.id); });
  resumenArmar();
}
document.addEventListener('input', e => {
  if (e.target.id === 'cxp-saldo') { S.cxpSaldo = e.target.value; resumenArmar(); }
  if (e.target.id === 'cxp-saldo-fecha') S.cxpSaldoFecha = e.target.value;
  if (e.target.classList && e.target.classList.contains('armar-monto')) { S.cxpMontos = S.cxpMontos || {}; S.cxpMontos[e.target.dataset.id] = e.target.value;

// v2.8 · los temas del menú desplegable que caen en esta misma página solo cambian el #hash: «#TORRE/seccion/pestaña» o «#/seccion»
addEventListener('hashchange', () => {

async function abrirTorre(clave) {
  S.torre = clave;
  const t = S.lista.torres.find(x => x.clave === clave);
  guardar({ torre_actual: clave, torre_nombre: t ? t.torre : '' });   // v3.1 · la misma torre en la barra y en todas las páginas
  if (StiliModulos.fijarTorre) StiliModulos.fijarTorre({ clave, torre: t ? t.torre : '' }, true);
  $('#sel-nombre').textContent = t ? t.torre : clave; $('#sel-gestor').textContent = t ? t.gestor : '';
  history.replaceState(null, '', '#' + encodeURIComponent(clave));
  const previo = DEMO ? null : memoria('detalle|' + clave);
  if (previo) pintarTorre(previo);
  else $('#contenido').innerHTML = '<p class="nota">Cargando ' + esc(t ? t.torre : clave) + '…</p>';
  try {
    const d = await api('torre_detalle', { torre: clave });
    if (S.torre !== clave) return;                       // ya abrió otra torre
    if (!DEMO) recordar('detalle|' + clave, d);
    if (previo && JSON.stringify(Object.assign({}, d, { accesos: undefined, bancos: undefined })) === JSON.stringify(Object.assign({}, previo, { accesos: undefined, bancos: undefined })) && !d.accesos && !d.bancos) return;
    if (previo && ocupado()) { S.detalle = d; return; }  // no se le borra lo que está escribiendo
    pintarTorre(d);
  } catch (err) {
    if (!previo) $('#contenido').innerHTML = '<div class="card"><p>' + esc(err.message) + '</p></div>';
  }
}

  el.style.cssText = 'position:fixed;left:50%;bottom:22px;transform:translateX(-50%);color:#fff;padding:10px 16px;border-radius:10px;z-index:90;max-width:calc(100% - 32px);font-weight:600'; document.body.appendChild(el); }
  el.style.background = error ? '#B3261E' : '#13293D'; el.textContent = msg; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { el.hidden = true; }, error ? 7000 : 3500); };
const dinero = v => v === null || v === undefined || isNaN(v) ? '—' : 'RD$ ' + Number(v).toLocaleString('en-US', { maximumFractionDigits: 0 });
const pct = v => v === null || v === undefined || isNaN(v) ? '—' : Math.round(v * 100) + ' %';

async function leerArchivo(f) {
  if (f.size > 12 * 1024 * 1024) throw new Error('El archivo pasa de 12 MB. Divídalo por mes.');
  const b64 = await new Promise((ok, mal) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = mal; r.readAsDataURL(f); });
  const out = { nombre: f.name, mime: f.type || 'application/octet-stream', base64: b64 };
  if (/\.(xlsx|xls|csv)$/i.test(f.name)) {   // la IA lee mejor el Excel como texto
    await cargarScript(XLSX_URL);
    const wb = XLSX.read(await f.arrayBuffer(), { type: 'array', cellDates: true });
    out.texto = wb.SheetNames.map(n => '### Hoja: ' + n + '\n' + XLSX.utils.sheet_to_csv(wb.Sheets[n], { dateNF: 'yyyy-mm-dd' })).join('\n\n');

document.addEventListener('submit', async e => {

      pintarFinanzas(); toast(archivos.length === 1 ? 'Archivo subido.' : archivos.length + ' archivos subidos.');
    }
    if (id === 'f-analizar') {
      const sel = $$('.sel-arch:checked').map(x => x.value);
      if (!sel.length) throw new Error('Marque los estados que quiere analizar.');
      toast('Analizando con IA… puede tardar hasta 2 minutos.');

    }

    }

    }

});
