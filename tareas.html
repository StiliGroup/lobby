<!doctype html>
<html lang="es-DO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tareas por gestor · Stili Soft</title>
<meta name="description" content="Tareas que recibe y cierra cada gestor por mes, a partir de los levantamientos de las torres.">
<meta name="theme-color" content="#003A75">
<link rel="icon" href="portal/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="stili-estilo.css?v=3.0">
<script src="config.js"></script>
<script src="stili-modulos.js?v=3.4.2"></script>
<style>
/* Colores de las series validados (claro y oscuro): recibidas = azul, cerradas = dorado */
:root { --s-rec: #3A5BA8; --s-cer: #B07F06; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --s-rec: #5577CC; --s-cer: #B98A12; } }
:root[data-theme="dark"] { --s-rec: #5577CC; --s-cer: #B98A12; }
.filtros { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.filtros select { border-radius: 8px; padding: 7px 10px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); max-width: 100%; }
.gestores { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); gap: 14px; }
.g h2 { margin: 0; font-size: 18px; color: var(--titulo); text-transform: none; letter-spacing: 0; }
.g .torres { color: var(--muted); font-size: 13px; margin: 2px 0 10px; }
.leyenda { display: flex; gap: 14px; font-size: 13px; color: var(--muted); margin: 4px 0 6px; }
.leyenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.graf { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; align-items: end; gap: 10px; height: 150px; padding: 0 2px;
  border-bottom: 1px solid var(--line); background: repeating-linear-gradient(to top, transparent 0 49px, var(--line) 49px 50px); background-size: 100% 50px; }
.mes { display: flex; gap: 2px; align-items: end; justify-content: center; height: 100%; }
.barra { width: min(22px, 40%); border-radius: 4px 4px 0 0; min-height: 0; cursor: default; position: relative; }
.barra.rec { background: var(--s-rec); } .barra.cer { background: var(--s-cer); }
.barra:hover, .barra:focus { outline: 2px solid var(--fg); outline-offset: 1px; }
.ejes { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 10px; font-size: 12px; color: var(--muted); text-align: center; margin-top: 4px; }
.tip { position: fixed; z-index: 50; background: var(--fg); color: var(--panel); padding: 6px 9px; border-radius: 8px; font-size: 13px; pointer-events: none; white-space: nowrap; }
.mini { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
.mini div { background: var(--panel-2); border-radius: 10px; padding: 8px 10px; font-size: 12px; color: var(--muted); }
.mini b { display: block; font-size: 20px; color: var(--fg); }
.cats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
details.tabla-mes summary { cursor: pointer; font-weight: 600; margin-top: 10px; color: var(--titulo); }
@media (max-width: 560px) { .mini { grid-template-columns: repeat(2, 1fr); } }
.vistas { display: flex; background: rgba(255,255,255,.12); border-radius: 10px; padding: 3px; gap: 3px; }
.vistas button { border: 0; background: transparent; color: #fff; padding: 7px 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
.vistas button[aria-pressed="true"] { background: #fff; color: #003A75; }
.oficios { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 460px), 1fr)); gap: 14px; }
.of h2 { margin: 0 0 4px; font-size: 18px; color: var(--titulo); text-transform: none; letter-spacing: 0; }
.of .t { border-top: 1px solid var(--line); padding: 10px 0 4px; }
.of .t h3 { margin: 0 0 6px; font-size: 15px; }
.of ul { margin: 0; padding-left: 18px; } .of li { margin-bottom: 4px; }
.of .prov { font-size: 13px; color: var(--muted); margin-top: 6px; }
.of .acciones-of { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.marcas { display: flex; flex-wrap: wrap; gap: 6px; }
.marcas label { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; font-size: 13px; cursor: pointer; background: var(--panel); color: var(--fg); }
.marcas input { width: auto; margin: 0; }
.marcas label:has(input:checked) { border-color: var(--titulo); background: var(--panel-2); font-weight: 600; }
.inv { background: var(--panel-2); border-radius: 10px; padding: 10px 12px; margin-top: 8px; font-size: 13px; word-break: break-all; }
td .acciones-fila { display: flex; gap: 6px; flex-wrap: wrap; }
.fact { font-size: 13px; } .fact b { font-size: 15px; }
</style>
</head>
<body>
<header class="cabecera"><div class="fila gutter"><div class="titulo"><small>Stili Group · Torres</small><b id="titulo">Tareas por gestor</b></div>
  <div class="seg vistas" role="tablist"><button type="button" data-vista="gestores" aria-pressed="true">Métricas por gestor</button><button type="button" data-vista="oficios" aria-pressed="false">Por oficio</button><button type="button" data-vista="suplidores" aria-pressed="false">Suplidores</button><button type="button" data-vista="ordenes" aria-pressed="false">Órdenes y facturas</button></div>
  <div class="filtros" id="filtros"><label class="nota" style="color:#C9D3DF">Período <select id="meses"><option value="3">3 meses</option><option value="6" selected>6 meses</option><option value="12">12 meses</option></select></label>
  <label class="nota" style="color:#C9D3DF">Gestor <select id="gestor"><option value="">Todos</option></select></label></div></div></header>
<main class="gutter" id="contenido"><p class="nota">Cargando…</p></main>
<div class="tip" id="tip" hidden></div>
<script>
const $ = s => document.querySelector(s);
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DEMO = new URLSearchParams(location.search).has('demo');
const MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const nombreMes = m => MES[Number(m.slice(5)) - 1] + ' ' + m.slice(2, 4);
const pct = (a, b) => b ? Math.round(a / b * 100) + ' %' : '—';
let datos = null;

async function cargar() {
  $('#contenido').innerHTML = '<p class="nota">Cargando…</p>';
  try {
    datos = DEMO ? demo(Number($('#meses').value)) : await StiliModulos.api('tareas_metricas', { meses: $('#meses').value });
    const g = $('#gestor').value;
    $('#gestor').innerHTML = '<option value="">Todos</option>' + datos.gestores.map(x => '<option' + (x.gestor === g ? ' selected' : '') + '>' + esc(x.gestor) + '</option>').join('');
    pintar();
  } catch (err) { $('#contenido').innerHTML = '<div class="card"><p>' + esc(err.message) + '</p>' + (/sesi/i.test(err.message) ? '<a class="btn primario" href="portal/">Entrar en el Portal</a>' : '') + '</div>'; }
}
function pintar() {
  const sel = $('#gestor').value, gs = datos.gestores.filter(x => !sel || x.gestor === sel);
  const suma = k => gs.reduce((a, x) => a + x.meses.reduce((b, m) => b + m[k], 0), 0);
  const rec = suma('recibidas'), cer = suma('cerradas');
  $('#contenido').innerHTML =
    '<div class="card"><div class="kpis" style="margin:0">' + [['Recibidas', rec], ['Cerradas', cer], ['Cierre', pct(cer, rec)],
      ['Abiertas hoy', gs.reduce((a, x) => a + x.abiertas, 0)], ['Abiertas +30 días', gs.reduce((a, x) => a + x.abiertas_30, 0)]]
      .map(([n, v]) => '<div class="kpi"><span>' + n + '</span><b>' + v + '</b></div>').join('') + '</div>' +
      '<p class="nota" style="margin:10px 0 0">Recibidas = tareas que salieron de los levantamientos ese mes (Portal o Bot de Telegram). Cerradas = tareas cerradas ese mes. Cada tarea se cuenta para el gestor responsable de la torre cuando se recibió.</p></div>' +
    (gs.length ? '<div class="gestores">' + gs.map(tarjeta).join('') + '</div>' : '<div class="vacio">Todavía no hay tareas. Suba un levantamiento en Torres → Tareas, o envíelo al Bot de Torres.</div>');
}
function tarjeta(x) {
  const max = Math.max(1, ...x.meses.map(m => Math.max(m.recibidas, m.cerradas)));
  const rec = x.meses.reduce((a, m) => a + m.recibidas, 0), cer = x.meses.reduce((a, m) => a + m.cerradas, 0);
  const alto = v => Math.round(v / max * 100) + '%';
  const cats = Object.keys(x.por_categoria).sort((a, b) => x.por_categoria[b].recibidas - x.por_categoria[a].recibidas);
  return '<section class="card g"><h2>' + esc(x.gestor) + '</h2><div class="torres">' + esc(x.torres.join(' · ')) + '</div>' +
    '<div class="mini"><div>Recibidas<b>' + rec + '</b></div><div>Cerradas<b>' + cer + '</b></div><div>Abiertas hoy<b>' + x.abiertas + '</b></div><div>Días para cerrar<b>' +
      (x.dias_promedio_cierre == null ? '—' : x.dias_promedio_cierre) + '</b></div></div>' +
    '<div class="leyenda" aria-hidden="true"><span><i style="background:var(--s-rec)"></i>Recibidas</span><span><i style="background:var(--s-cer)"></i>Cerradas</span></div>' +
    '<div class="graf" role="img" aria-label="Tareas recibidas y cerradas por mes de ' + esc(x.gestor) + '">' + x.meses.map(m =>
      '<div class="mes"><div class="barra rec" tabindex="0" style="height:' + alto(m.recibidas) + '" data-tip="' + esc(nombreMes(m.mes) + ' · Recibidas: ' + m.recibidas) + '"></div>' +
      '<div class="barra cer" tabindex="0" style="height:' + alto(m.cerradas) + '" data-tip="' + esc(nombreMes(m.mes) + ' · Cerradas: ' + m.cerradas) + '"></div></div>').join('') + '</div>' +
    '<div class="ejes">' + x.meses.map(m => '<span>' + nombreMes(m.mes) + '</span>').join('') + '</div>' +
    '<details class="tabla-mes"><summary>Ver la tabla por mes</summary><div class="tabla"><table><thead><tr><th>Mes</th><th>Recibidas</th><th>Cerradas</th><th>Cierre</th></tr></thead><tbody>' +
      x.meses.map(m => '<tr><td>' + nombreMes(m.mes) + '</td><td>' + m.recibidas + '</td><td>' + m.cerradas + '</td><td>' + pct(m.cerradas, m.recibidas) + '</td></tr>').join('') + '</tbody></table></div></details>' +
    (cats.length ? '<div class="cats">' + cats.map(k => '<span class="chip azul">' + esc(datos.categorias[k] || k) + ': ' + x.por_categoria[k].recibidas + ' · ' + x.por_categoria[k].cerradas + ' cerradas</span>').join('') + '</div>' : '') +
    (x.abiertas_30 ? '<p class="nota" style="color:var(--warn);margin:10px 0 0">⚠ ' + x.abiertas_30 + ' tarea(s) abiertas hace más de 30 días.</p>' : '') + '</section>';
}
// Tooltip de cada barra (ratón y teclado)
function tip(e) {
  const b = e.target.closest && e.target.closest('[data-tip]'), t = $('#tip');
  if (!b) { t.hidden = true; return; }
  t.textContent = b.dataset.tip; t.hidden = false;
  const r = b.getBoundingClientRect();
  t.style.left = Math.min(innerWidth - t.offsetWidth - 8, Math.max(8, r.left + r.width / 2 - t.offsetWidth / 2)) + 'px';
  t.style.top = Math.max(8, r.top - t.offsetHeight - 8) + 'px';
}
document.addEventListener('mouseover', tip); document.addEventListener('focusin', tip);
document.addEventListener('mouseout', e => { if (e.target.closest && e.target.closest('[data-tip]')) $('#tip').hidden = true; });
$('#meses').addEventListener('change', cargar); $('#gestor').addEventListener('change', pintar);

// v2.3 · Suplidores por oficio: todas las tareas abiertas de eléctricos, plomería, pintura… para hacer una sola llamada por suplidor
const PRIO = { alta: 'rojo', media: 'ambar', baja: 'azul' };
let oficios = null;
const VISTAS = { gestores: 'Tareas por gestor', oficios: 'Tareas por oficio', suplidores: 'Suplidores', ordenes: 'Órdenes de trabajo y facturas' };
function vista() { const h = location.hash.slice(1); return VISTAS[h] ? h : 'gestores'; }
function cambiarVista() {
  const v = vista();
  document.querySelectorAll('[data-vista]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.vista === v)));
  $('#filtros').hidden = v !== 'gestores'; $('#titulo').textContent = VISTAS[v];
  document.title = $('#titulo').textContent + ' · Stili';
  ({ oficios: cargarOficios, suplidores: cargarSuplidores, ordenes: cargarOrdenes }[v] || cargar)();
}
document.addEventListener('click', e => { const b = e.target.closest('[data-vista]'); if (!b) return; history.replaceState(null, '', b.dataset.vista === 'gestores' ? location.pathname + location.search : '#' + b.dataset.vista); cambiarVista(); });
addEventListener('hashchange', cambiarVista);
async function cargarOficios() {
  $('#contenido').innerHTML = '<p class="nota">Cargando…</p>';
  try { oficios = DEMO ? demoOficios() : await StiliModulos.api('tareas_oficios'); pintarOficios(); }
  catch (err) { $('#contenido').innerHTML = '<div class="card"><p>' + esc(err.message) + '</p></div>'; }
}
function textoOficio(o) {
  return o.nombre + ' · trabajos pendientes en ' + o.torres.length + (o.torres.length === 1 ? ' torre' : ' torres') + '\n\n' + o.torres.map(t => t.torre + ':\n' +
    t.tareas.map(x => '  - ' + x.descripcion + (x.prioridad === 'alta' ? ' (URGENTE)' : '')).join('\n')).join('\n\n');
}
function pintarOficios() {
  const l = oficios.oficios;
  $('#contenido').innerHTML = '<div class="card"><p class="nota" style="margin:0">Tareas abiertas de mantenimiento agrupadas por oficio, de todas sus torres. Llame una vez al suplidor con la lista completa. ' +
    'El oficio lo pone la IA al leer el levantamiento; se corrige en Torres → Tareas.</p></div>' +
    (l.length ? '<div class="oficios">' + l.map((o, i) => '<section class="card of"><h2>' + esc(o.nombre) + '</h2><div class="chips"><span class="chip azul">' + o.abiertas + (o.abiertas === 1 ? ' abierta' : ' abiertas') + '</span>' +
      (o.alta ? '<span class="chip rojo">' + o.alta + (o.alta === 1 ? ' urgente' : ' urgentes') + '</span>' : '') + '<span class="chip">' + o.torres.length + (o.torres.length === 1 ? ' torre' : ' torres') + '</span></div>' +
      o.torres.map(t => '<div class="t"><h3><a href="torres.html?m=operaciones#' + esc(t.clave) + '/tareas">' + esc(t.torre) + '</a></h3><ul>' + t.tareas.map(x => '<li>' + esc(x.descripcion) +
        ' <span class="chip ' + (PRIO[x.prioridad] || '') + '">' + esc(x.prioridad) + '</span>' + (x.fecha ? ' <small class="nota">' + esc(x.fecha) + '</small>' : '') + '</li>').join('') + '</ul>' +
        (t.proveedores.length ? '<div class="prov">Proveedor de la torre: ' + t.proveedores.map(p => esc(p.empresa || p.servicio) + (p.contacto ? ' (' + esc(p.contacto) + ')' : '') +
          (p.telefono ? ' · <a href="tel:' + esc(p.telefono) + '">' + esc(p.telefono) + '</a>' : '')).join(' · ') + '</div>' : '<div class="prov">Sin proveedor registrado para este oficio en la torre.</div>') + '</div>').join('') +
      '<div class="acciones-of"><button type="button" class="btn" data-copiar="' + i + '">Copiar la lista para el suplidor</button>' +
      '<a class="btn" href="https://wa.me/?text=' + encodeURIComponent(textoOficio(o)) + '" target="_blank" rel="noopener">Enviar por WhatsApp</a></div></section>').join('') + '</div>'
      : '<div class="vacio">No hay tareas abiertas de técnicos o suplidores.</div>');
}
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-copiar]'); if (!b) return;
  try { await navigator.clipboard.writeText(textoOficio(oficios.oficios[Number(b.dataset.copiar)])); b.textContent = '✓ Copiada'; setTimeout(() => { b.textContent = 'Copiar la lista para el suplidor'; }, 2000); }
  catch (err) { alert('No se pudo copiar.'); }
});
// ------------------------------------------------------------------ v2.4 · Suplidores (inscritos en el Bot de Torres)
let sup = null, supEdit = null;
async function cargarSuplidores(r) {
  if (!r) $('#contenido').innerHTML = '<p class="nota">Cargando…</p>';
  try { sup = r || (DEMO ? demoSuplidores() : await StiliModulos.api('suplidores_datos')); pintarSuplidores(); }
  catch (err) { $('#contenido').innerHTML = '<div class="card"><p>' + esc(err.message) + '</p></div>'; }
}
function formSuplidor(p) {
  const marcadas = (lista, sel, nombre, txt) => '<div class="marcas">' + lista.map(k => '<label><input type="checkbox" name="' + nombre + '" value="' + esc(k) + '"' + (sel.indexOf(k) >= 0 ? ' checked' : '') + '>' + esc(txt ? txt(k) : k) + '</label>').join('') + '</div>';
  return '<form class="card form" id="f-sup"><h2 style="grid-column:1/-1">' + (p.id ? 'Editar suplidor' : 'Nuevo suplidor') + '</h2>' +
    '<label>Nombre o empresa *<input name="nombre" required value="' + esc(p.nombre) + '"></label><label>Persona de contacto<input name="contacto" value="' + esc(p.contacto) + '"></label>' +
    '<label>Teléfono / WhatsApp<input name="telefono" inputmode="tel" value="' + esc(p.telefono) + '"></label><label>Correo<input name="correo" type="email" value="' + esc(p.correo) + '"></label>' +
    '<label>RNC o cédula<input name="rnc" value="' + esc(p.rnc) + '"></label><label class="ancho">Notas<input name="notas" value="' + esc(p.notas) + '" placeholder="Horario, zona, condiciones…"></label>' +
    '<div class="ancho"><span class="nota">Oficios *</span>' + marcadas(Object.keys(sup.oficios), p.oficios || [], 'oficios', k => sup.oficios[k]) + '</div>' +
    '<div class="ancho"><span class="nota">Torres que atiende' + (sup.todas_las_torres ? ' (sin marcar = todas)' : '') + '</span>' + marcadas(sup.torres, p.torres || [], 'torres') + '</div>' +
    '<div class="acciones-fila ancho"><button class="btn primario">Guardar</button><button type="button" class="btn" data-sup-cerrar="1">Cancelar</button></div><p class="nota ancho" id="sup-msg" role="status"></p></form>';
}
function pintarSuplidores() {
  const d = sup, tg = p => p.telegram ? '<span class="chip verde">✓ En Telegram' + (p.telegram_usuario ? ' · @' + esc(p.telegram_usuario) : '') + '</span>'
    : p.invitacion_pendiente ? '<span class="chip ambar">Invitación enviada</span>' : '<span class="chip">Sin Telegram</span>';
  $('#contenido').innerHTML = '<div class="card"><div class="cab"><h2>Suplidores</h2>' + (d.puede_editar ? '<button type="button" class="btn primario" data-sup-nuevo="1">Nuevo suplidor</button>' : '') + '</div>' +
    '<p class="nota" style="margin:0">Los suplidores inscritos en el Bot de Torres reciben por Telegram la orden de trabajo (torre y trabajo a realizar) cuando la gestora la autoriza, y envían por ahí la foto de su factura: ' +
    'la factura llega sola al grupo de Cuentas por Pagar.' + (d.bot ? '' : ' <b>Falta encender el Bot de Torres una vez para tener su enlace.</b>') + '</p></div>' +
    (supEdit ? formSuplidor(supEdit) : '') + '<div id="sup-inv"></div>' +
    '<div class="card">' + tabla(['Suplidor', 'Oficios', 'Torres', 'Telegram', ''], d.suplidores.map(p => '<tr' + (p.activo ? '' : ' class="cerrada"') + '><td><b>' + esc(p.nombre) + '</b>' +
      (p.contacto ? '<br><small>' + esc(p.contacto) + '</small>' : '') + (p.telefono ? '<br><small><a href="tel:' + esc(p.telefono) + '">' + esc(p.telefono) + '</a></small>' : '') + (p.activo ? '' : '<br><small>Inactivo</small>') + '</td><td>' +
      p.oficios.map(o => '<span class="chip azul">' + esc(d.oficios[o] || o) + '</span>').join(' ') + '</td><td><small>' + (p.torres.length ? esc(p.torres.join(', ')) : 'Todas') + '</small></td><td>' + tg(p) + '</td><td>' +
      (d.puede_editar ? '<div class="acciones-fila"><button type="button" class="btn" data-sup-editar="' + esc(p.id) + '">Editar</button>' + (p.activo && !p.telegram ? '<button type="button" class="btn primario" data-sup-invitar="' + esc(p.id) + '">Invitar a Telegram</button>' : '') +
        '<button type="button" class="btn" data-sup-activo="' + esc(p.id) + '" data-val="' + (!p.activo) + '">' + (p.activo ? 'Desactivar' : 'Activar') + '</button></div>' : '') + '</td></tr>'),
      'Todavía no hay suplidores. Agregue los de cada oficio (eléctrico, plomería, pintura…).') + '</div>' +
    (d.puede_editar && d.sugeridos.length ? '<div class="card"><h2>Proveedores de sus torres que aún no son suplidores</h2><p class="nota">Vienen de Torres → Proveedores. Agréguelos con un toque y luego invítelos a Telegram.</p>' +
      tabla(['Proveedor', 'Oficio', 'Torres', ''], d.sugeridos.map((g, i) => '<tr><td><b>' + esc(g.nombre) + '</b>' + (g.telefono ? '<br><small>' + esc(g.telefono) + '</small>' : '') + '</td><td>' +
        g.oficios.map(o => esc(d.oficios[o])).join(', ') + '</td><td><small>' + esc(g.torres.join(', ')) + '</small></td><td><button type="button" class="btn" data-sup-sug="' + i + '">Agregar</button></td></tr>'), '') + '</div>' : '');
  const f = $('#f-sup'); if (f) { f.addEventListener('submit', guardarSuplidor); f.scrollIntoView({ block: 'nearest' }); }
}
async function guardarSuplidor(e) {
  e.preventDefault();
  const f = e.target, v = n => [...f.querySelectorAll('input[name="' + n + '"]:checked')].map(x => x.value);

}
document.addEventListener('click', async e => {

let ord = null; const FILTRO_O = { estado: 'abiertas', torre: '' };

const rd = n => 'RD$ ' + Number(n || 0).toLocaleString('es-DO', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
async function cargarOrdenes(r) {

function pintarOrdenes() {

    '<p class="nota" style="margin:10px 0 0">La gestora envía la orden desde Torres → Tareas o desde el Bot de Torres. El suplidor la acepta en Telegram y envía la foto de la factura: el bot la lee y la pasa al grupo de Cuentas por Pagar.</p></div>' +
    '<div class="card"><div class="filtros-t"><select id="fo-estado" aria-label="Estado"><option value="abiertas">Abiertas</option><option value="todas">Todas</option>' +
      Object.keys(d.estados).map(k => '<option value="' + k + '">' + esc(d.estados[k]) + '</option>').join('') + '</select><select id="fo-torre" aria-label="Torre"><option value="">Todas las torres</option>' +
      torres.map(t => '<option>' + esc(t) + '</option>').join('') + '</select></div>' +
    tabla(['Orden', 'Torre', 'Suplidor', 'Trabajo', 'Estado', 'Factura', ''], lista.map(o => '<tr><td><b class="mono">' + esc(o.id) + '</b><br><small>' + esc(o.creado_en) + '<br>' + esc(o.solicitado_por) + '</small></td>' +
      '<td>' + esc(o.torre) + '<br><small>' + esc(o.oficio_nombre) + '</small></td><td>' + esc(o.suplidor) + '</td><td><small>' + esc(o.descripcion).replace(/\n/g, '<br>') + '</small>' +
      (o.respuesta_nota ? '<br><small><b>Nota:</b> ' + esc(o.respuesta_nota) + '</small>' : '') + '</td><td><span class="chip ' + (COLOR_ORDEN[o.estado] || '') + '">' + esc(d.estados[o.estado] || o.estado) + '</span>' +
      (o.cxp_por ? '<br><small>' + esc(o.cxp_por) + ' · ' + esc(o.cxp_en) + '</small>' : '') + '</td><td class="fact">' + (o.factura ? '<b>' + rd(o.factura.total) + '</b>' +
        (o.factura.ncf ? '<br>NCF ' + esc(o.factura.ncf) : '') + (o.factura.itbis ? '<br>ITBIS ' + rd(o.factura.itbis) : '') + (o.factura.fecha ? '<br>' + esc(o.factura.fecha) : '') + (o.factura.emisor ? '<br><small>' + esc(o.factura.emisor) + (o.factura.rnc ? ' · RNC ' + esc(o.factura.rnc) : '') + '</small>' : '') : '—') + '</td><td><div class="acciones-fila">' +
      (d.puede_cxp && o.factura && o.estado === 'facturada' ? '<button type="button" class="btn" data-cxp="recibida" data-id="' + esc(o.id) + '">Recibida</button>' : '') +
      (d.puede_cxp && o.factura && ['facturada', 'recibida'].indexOf(o.estado) >= 0 ? '<button type="button" class="btn primario" data-cxp="pagada" data-id="' + esc(o.id) + '">Pagada</button>' : '') +
      (d.puede_cancelar && ['por_enviar', 'enviada', 'sin_telegram', 'aceptada', 'rechazada'].indexOf(o.estado) >= 0 ? '<button type="button" class="btn" data-ocancelar="' + esc(o.id) + '">Cancelar</button>' : '') + '</div></td></tr>'),
      'No hay órdenes en este filtro.') + '</div>';
  $('#fo-estado').value = FILTRO_O.estado; $('#fo-torre').value = FILTRO_O.torre;
}
document.addEventListener('change', e => { if (e.target.id === 'fo-estado') { FILTRO_O.estado = e.target.value; pintarOrdenes(); } if (e.target.id === 'fo-torre') { FILTRO_O.torre = e.target.value; pintarOrdenes(); } });
document.addEventListener('click', async e => {
