<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Aprobación de la Junta · Stili Group</title>
<meta name="theme-color" content="#003A75">
<link rel="icon" href="portal/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<script src="config.js"></script>
<style>
/* v3.0 · El presidente de la Junta aprueba o rechaza un pago que pasa el monto fijado (enlace único por pago). */
:root { --bg: #F3F5F9; --panel: #FFFFFF; --fg: #13293D; --muted: #5A6B78; --line: #DCE3EC; --azul: #003A75; --oro: #DCB40C; --ok: #1E7D4F; --ok-s: #E3F3EA; --crit: #B3261E; --crit-s: #FBE6E4; }
@media (prefers-color-scheme: dark) { :root { --bg: #0C1822; --panel: #13222F; --fg: #E6EEF2; --muted: #93A6B4; --line: #26394A; --azul: #6E9BD6; --ok: #4CC08A; --ok-s: #143024; --crit: #F07C73; --crit-s: #3A1A18; } }
* { box-sizing: border-box; } [hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 Montserrat, "Segoe UI", system-ui, sans-serif; }
input, textarea, button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--oro); outline-offset: 2px; }
.top { background: #003A75; color: #fff; border-bottom: 3px solid var(--oro); }
.top .in, main { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
.top .in { padding-block: 18px; }
.top small { color: var(--oro); font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
.top h1 { margin: 2px 0; font-size: 21px; }
main { padding-block: 16px 56px; display: grid; gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; } dt { color: var(--muted); font-size: 13px; font-weight: 600; } dd { margin: 0; font-weight: 600; }
.monto { font-size: 26px; color: var(--azul); }
label { display: grid; gap: 4px; font-size: 13.5px; font-weight: 600; }
input, textarea { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 10px 12px; font-size: 16px; width: 100%; }
textarea { min-height: 70px; }
.botones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { border: 0; border-radius: 10px; padding: 13px 18px; font-weight: 700; font-size: 16px; cursor: pointer; color: #fff; }
.si { background: var(--ok); } .no { background: var(--crit); } .btn:disabled { opacity: .6; }
.error { color: var(--crit); font-size: 13px; font-weight: 600; border-left: 2px solid var(--crit); padding-left: 9px; }
.estado { border-radius: 12px; padding: 18px; text-align: center; font-weight: 600; }
.estado.aprobada { background: var(--ok-s); color: var(--ok); } .estado.rechazada { background: var(--crit-s); color: var(--crit); }
.priv { font-size: 12.5px; color: var(--muted); margin: 0; }
.demo { color: #8A5300; font-size: 12px; font-weight: 600; border-left: 2px solid #C98A00; padding-left: 9px; }
</style>
</head>
<body>
<header class="top"><div class="in"><small>Stili Group · Junta de Condóminos</small><h1>Aprobación de un pago</h1></div></header>
<main>
  <p class="demo" id="demo" hidden>Demostración: nada se envía.</p>
  <p class="error" id="error" hidden></p>
  <div class="card" id="det" hidden></div>
  <div class="estado" id="estado" hidden></div>
  <form class="card" id="f" hidden novalidate>
    <label>Su nombre (queda registrado como quien decide)<input name="nombre" autocomplete="name" required maxlength="80"></label>
    <label>Nota (obligatoria si rechaza)<textarea name="nota" maxlength="300"></textarea></label>
    <p class="error" id="err" hidden></p>
    <div class="botones"><button class="btn si" type="submit" value="aprobada">Aprobar</button><button class="btn no" type="submit" value="rechazada">Rechazar</button></div>
    <p class="priv">Mientras no se apruebe, la administración no puede aprobar ni pagar esta factura en el sistema.</p>
  </form>
</main>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const Q = new URLSearchParams(location.search), TOKEN = (Q.get('t') || '').trim(), DEMO = Q.has('demo') || !(window.STILI && window.STILI.servicio);
let demo = { torre: 'Torre Demo Prime', suplidor: 'Generadores del Caribe', monto: 86500, concepto: 'Overhaul planta eléctrica', estado: 'pendiente', pedida_por: 'Contabilidad Stili', pedida_en: new Date().toISOString(), umbral: 50000 };
async function api(accion, datos) {
  if (DEMO) { if (accion === 'ctb_aprobacion_decidir') demo = Object.assign({}, demo, { estado: datos.decision, decidida_por: datos.nombre, nota: datos.nota, decidida_en: new Date().toISOString() }); return demo; }
  const r = await fetch(window.STILI.servicio, { method: 'POST', body: JSON.stringify(Object.assign({ accion }, datos)) });
  const j = await r.json(); if (!j.ok) throw new Error(j.error || 'No se pudo completar.'); return j;
}
const dinero = v => 'RD$ ' + Number(v || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fecha = f => { const d = new Date(f); return isNaN(d) ? esc(f) : d.toLocaleDateString('es-DO', { day: 'numeric', month: 'long', year: 'numeric' }); };
function pintar(a) {
  $('#det').innerHTML = '<dl><dt>Torre</dt><dd>' + esc(a.torre) + '</dd><dt>Suplidor</dt><dd>' + esc(a.suplidor) + '</dd><dt>Concepto</dt><dd>' + esc(a.concepto || '—') + '</dd><dt>Monto</dt><dd class="monto">' + dinero(a.monto) + '</dd>' +
    '<dt>Pedido por</dt><dd>' + esc(a.pedida_por || '') + (a.pedida_en ? ' · ' + fecha(a.pedida_en) : '') + '</dd></dl>' + (a.umbral ? '<p class="priv" style="margin-top:10px">Pasa el monto de ' + dinero(a.umbral) + ' que la Junta fijó para pagos sin su aprobación.</p>' : '');
  $('#det').hidden = false;
  if (a.estado === 'pendiente') { $('#f').hidden = false; $('#estado').hidden = true; }
  else { $('#f').hidden = true; const e = $('#estado'); e.className = 'estado ' + a.estado; e.textContent = (a.estado === 'aprobada' ? 'Aprobado' : 'Rechazado') + ' por ' + (a.decidida_por || '') + (a.decidida_en ? ' el ' + fecha(a.decidida_en) : '') + (a.nota ? '. Nota: ' + a.nota : '') + '.'; e.hidden = false; }
}
(async () => {
  if (DEMO) $('#demo').hidden = false;
  if (!TOKEN && !DEMO) { $('#error').textContent = 'Este enlace está incompleto. Pida a la administración que se lo envíe de nuevo.'; $('#error').hidden = false; return; }
  try { pintar(await api('ctb_aprobacion_info', { t: TOKEN })); }
  catch (err) { $('#error').textContent = err.message; $('#error').hidden = false; }
})();
$('#f').addEventListener('submit', async e => {
  e.preventDefault();
  const dec = (e.submitter || {}).value, fd = new FormData(e.target), err = $('#err'); err.hidden = true;
  if (String(fd.get('nombre')).trim().length < 3) { err.textContent = 'Escriba su nombre.'; err.hidden = false; return; }
  if (dec === 'rechazada' && String(fd.get('nota')).trim().length < 4) { err.textContent = 'Escriba por qué lo rechaza.'; err.hidden = false; return; }
  if (!confirm(dec === 'aprobada' ? '¿Aprobar este pago?' : '¿Rechazar este pago?')) return;
  e.target.querySelectorAll('button').forEach(b => { b.disabled = true; });
  try { pintar(await api('ctb_aprobacion_decidir', { t: TOKEN, decision: dec, nombre: fd.get('nombre'), nota: fd.get('nota') })); }
  catch (er) { err.textContent = er.message; err.hidden = false; e.target.querySelectorAll('button').forEach(b => { b.disabled = false; }); }
});
</script>
</body>
</html>
